<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP-M課 生産リアルタイムボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;font-size:14px;background:#f0f2f5;color:#222;min-height:100vh}
.header{background:#1D9E75;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.header h1{font-size:16px;font-weight:700}
.header .subtitle{font-size:12px;opacity:.8;margin-top:2px}
.app{max-width:700px;margin:0 auto;padding:12px}
.tab-bar{display:flex;background:#fff;border-radius:10px;padding:4px;gap:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab{flex:1;padding:9px 12px;border:none;background:none;cursor:pointer;font-size:14px;color:#888;border-radius:7px;font-weight:500;transition:all .15s}
.tab.active{background:#1D9E75;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(29,158,117,.35)}
.pane{display:none}
.pane.active{display:block}
.card{border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:13px;font-weight:700;color:#444;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';display:inline-block;width:4px;height:14px;background:#1D9E75;border-radius:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:#888;font-weight:500}
.field input[type=text]{height:36px;padding:0 10px;border:1px solid #d0d0d0;border-radius:7px;font-size:14px;background:#fafafa;width:100%;transition:all .15s}
.field input[type=text]:focus{outline:none;border-color:#1D9E75;background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.field-xl{flex:3;min-width:140px}
.field-lg{flex:2;min-width:110px}
.field-sm{flex:1;min-width:75px}
.chk-row{display:flex;align-items:center;gap:16px;margin-top:10px;padding-top:8px;border-top:1px dashed #eee}
.chk-row .chk-label{font-size:12px;color:#888;font-weight:500}
.chk-row label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;color:#333}
.chk-row input[type=checkbox]{width:17px;height:17px;accent-color:#1D9E75;cursor:pointer}
.sec-label{font-size:11px;font-weight:700;color:#1D9E75;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec-label::after{content:'';flex:1;height:1px;background:#d5f0e8}
.next-row-hd{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:3px;padding:0 2px}
.next-row-hd span{font-size:11px;color:#999;font-weight:600}
.next-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:7px}
.btn-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn-save{padding:11px 28px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(29,158,117,.35);transition:all .15s}
.btn-save:hover{background:#168a63}
.btn-save:active{transform:scale(.97)}
.btn-save:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-reset{padding:11px 18px;background:#fff;color:#888;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:#f5f5f5;color:#333;border-color:#bbb}
.err{background:#fee;color:#a00;border:1px solid #fcc;border-radius:8px;padding:9px 13px;margin-top:8px;font-size:13px;display:none}
.err.show{display:block}
.loaded-banner{font-size:12px;color:#0F6E56;background:#E1F5EE;border:1px solid #9FE1CB;border-radius:8px;padding:8px 13px;margin-bottom:10px;display:none;align-items:center;gap:6px}
.loaded-banner.show{display:flex}
.fb-status{font-size:11px;padding:6px 12px;border-radius:7px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fb-ok{background:#E1F5EE;color:#0F6E56;border:1px solid #9FE1CB}
.fb-err{background:#fee;color:#a00;border:1px solid #fcc}
.fb-wait{background:#f5f5f5;color:#888;border:1px solid #ddd}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:9px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999;white-space:nowrap;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* ===== 閲覧画面 ===== */
#pane-view{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:linear-gradient(160deg,#0d2f6e 0%,#1251a3 45%,#0a3d8f 100%);
  overflow:hidden;z-index:200;
  display:none;flex-direction:column;
}
#pane-view.active{display:flex}
#pane-view::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,20,80,.06) 3px,rgba(0,20,80,.06) 4px);
  pointer-events:none;z-index:0;
}
.view-header-bar{
  position:relative;z-index:1;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;
  background:rgba(5,30,90,.75);
  border-bottom:1px solid rgba(120,180,255,.35);
  flex-shrink:0;
}
.view-title-block h2{font-size:15px;font-weight:700;color:#aed8ff;letter-spacing:.08em;text-shadow:0 0 16px rgba(160,210,255,.7)}
.view-title-block .sub{font-size:11px;color:#6a9fd8;margin-top:2px;letter-spacing:.04em}
.view-ctrl{display:flex;align-items:center;gap:10px}
.ref-btn{padding:6px 14px;border:1px solid rgba(160,210,255,.45);border-radius:6px;background:rgba(160,210,255,.12);font-size:13px;cursor:pointer;color:#aed8ff;transition:all .15s}
.ref-btn:hover{background:rgba(160,210,255,.25);color:#cceeff}
.back-btn{padding:6px 14px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:rgba(255,255,255,.06);font-size:13px;cursor:pointer;color:#aaa;transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.clock{font-size:24px;font-weight:700;color:#fff;letter-spacing:.12em;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(180,220,255,.9);min-width:100px;text-align:right}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,.7);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.view-grid{
  position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:1px;padding:1px;background:rgba(120,180,255,.2);align-content:start;
}
.view-grid::-webkit-scrollbar{width:5px}
.view-grid::-webkit-scrollbar-track{background:transparent}
.view-grid::-webkit-scrollbar-thumb{background:rgba(160,210,255,.35);border-radius:3px}
.vline{background:rgba(15,60,160,.72);display:flex;flex-direction:column;min-height:0}
.vl-hd{padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;background:linear-gradient(90deg,rgba(10,60,160,.92) 0%,rgba(5,40,130,.85) 100%);border-bottom:1px solid rgba(140,200,255,.35);flex-shrink:0}
.vl-no{font-size:15px;font-weight:800;color:#fff;letter-spacing:.06em;white-space:nowrap;text-shadow:0 0 14px rgba(180,225,255,.85)}
.vl-who{font-size:11px;color:#cce8ff;background:rgba(140,200,255,.2);padding:2px 7px;border-radius:4px;white-space:nowrap}
.vl-when{font-size:11px;color:#6aaee0;margin-left:auto;white-space:nowrap}
.vl-next-badge{font-size:11px;color:#7df4ff;background:rgba(100,230,255,.1);border:1px solid rgba(100,230,255,.35);border-radius:4px;padding:2px 8px;white-space:nowrap;text-shadow:0 0 8px rgba(100,230,255,.5)}
.vl-body{padding:0 14px 12px;background:rgba(20,70,180,.35)}
.vl-section{margin-top:10px}
.vl-section-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#aad8ff;border-bottom:1px solid rgba(160,215,255,.35);padding-bottom:4px;margin-bottom:6px}
.prod-table{width:100%;border-collapse:collapse;font-size:13px}
.prod-table th{font-size:10px;color:#aad8ff;font-weight:700;padding:5px 6px;text-align:left;border-bottom:1px solid rgba(160,215,255,.3);background:rgba(30,90,210,.4)}
.prod-table td{padding:6px 8px;border-bottom:1px solid rgba(140,200,255,.2);vertical-align:middle;color:#dff0ff;background:rgba(25,80,200,.25)}
.prod-table tr:last-child td{border-bottom:none}
.prod-table tr:hover td{background:rgba(60,130,255,.3)}
.prod-table td strong{color:#fff;text-shadow:0 0 8px rgba(180,220,255,.5)}
.proc-tag{font-size:12px;color:#7df4ff;background:rgba(100,220,255,.12);border:1px solid rgba(100,220,255,.4);padding:1px 7px;border-radius:4px;white-space:nowrap;display:inline-block;font-weight:600;text-shadow:0 0 8px rgba(120,230,255,.5)}
.cbadge{font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap;display:inline-block;margin-right:3px;font-weight:600}
.cb-on{background:rgba(80,200,255,.12);color:#5dd8ff;border:1px solid rgba(80,200,255,.35);text-shadow:0 0 6px rgba(80,200,255,.5)}
.cb-off{background:rgba(255,255,255,.04);color:#2a5080;border:1px solid rgba(255,255,255,.07)}
.next-table{width:100%;border-collapse:collapse;font-size:13px}
.next-table th{font-size:10px;color:#aad8ff;font-weight:700;padding:5px 6px;text-align:left;border-bottom:1px solid rgba(160,215,255,.3);background:rgba(30,90,210,.4)}
.next-table td{padding:6px 8px;border-bottom:1px solid rgba(140,200,255,.2);color:#dff0ff;background:rgba(25,80,200,.25)}
.next-table tr:last-child td{border-bottom:none}
.next-table td strong{color:#fff;text-shadow:0 0 8px rgba(180,220,255,.5)}
.empty{text-align:center;padding:48px 16px;color:#3a6090;font-size:14px;line-height:2}
.no-data{color:#3a6090;font-size:13px;padding:8px 0}
@media(max-width:480px){
  .next-row{grid-template-columns:1fr}
  .next-row-hd{display:none}
  .field-xl,.field-lg,.field-sm{min-width:0}
  .view-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🏭 JP-M課 生産リアルタイムボード</h1>
    <div class="subtitle">稼働製品・工程・NEXT生産予定 入力・閲覧システム</div>
  </div>
</div>

<div class="app">
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('input')">📝 情報入力</button>
    <button class="tab" onclick="switchTab('view')">📋 閲覧表示</button>
  </div>

  <!-- 情報入力 -->
  <div id="pane-input" class="pane active">
    <div class="fb-status fb-wait" id="fb-status">⏳ Firebase 接続中…</div>
    <div class="loaded-banner" id="loaded-banner"><span>✅</span><span id="loaded-msg"></span></div>

    <div class="card">
      <div class="card-title">基本情報</div>
      <div class="row">
        <div class="field field-sm">
          <label>ライン No. ＊</label>
          <input type="text" id="lineNo" list="dl-lineNo" placeholder="例：A-01" autocomplete="off" oninput="onLineNoInput()">
          <datalist id="dl-lineNo"></datalist>
        </div>
        <div class="field field-lg">
          <label>更新者名</label>
          <input type="text" id="updater" list="dl-updater" placeholder="例：山田" autocomplete="off">
          <datalist id="dl-updater"></datalist>
        </div>
      </div>
    </div>

    <div class="sec-label">稼働製品詳細</div>
    <div class="card">
      <div class="card-title">品名 ①</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn1" list="dl-pn1" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn1"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps1" list="dl-ps1" placeholder="01" autocomplete="off"><datalist id="dl-ps1"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe1" list="dl-pe1" placeholder="05" autocomplete="off"><datalist id="dl-pe1"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_1"> 1回目</label><label><input type="checkbox" id="c2_1"> 2回目</label></div>
    </div>
    <div class="card">
      <div class="card-title">品名 ②</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn2" list="dl-pn2" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn2"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps2" list="dl-ps2" placeholder="01" autocomplete="off"><datalist id="dl-ps2"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe2" list="dl-pe2" placeholder="05" autocomplete="off"><datalist id="dl-pe2"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_2"> 1回目</label><label><input type="checkbox" id="c2_2"> 2回目</label></div>
    </div>
    <div class="card">
      <div class="card-title">品名 ③</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn3" list="dl-pn3" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn3"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps3" list="dl-ps3" placeholder="01" autocomplete="off"><datalist id="dl-ps3"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe3" list="dl-pe3" placeholder="05" autocomplete="off"><datalist id="dl-pe3"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_3"> 1回目</label><label><input type="checkbox" id="c2_3"> 2回目</label></div>
    </div>
    <div class="card">
      <div class="card-title">品名 ④</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn4" list="dl-pn4" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn4"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps4" list="dl-ps4" placeholder="01" autocomplete="off"><datalist id="dl-ps4"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe4" list="dl-pe4" placeholder="05" autocomplete="off"><datalist id="dl-pe4"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_4"> 1回目</label><label><input type="checkbox" id="c2_4"> 2回目</label></div>
    </div>

    <div class="sec-label">NEXT 生産予定</div>
    <div class="card">
      <div class="next-row-hd"><span>品名</span><span>工程 開始</span><span>工程 終了</span></div>
      <div class="next-row">
        <div class="field"><input type="text" id="nn1" list="dl-nn1" placeholder="品名①" autocomplete="off"><datalist id="dl-nn1"></datalist></div>
        <div class="field"><input type="text" id="nps1" list="dl-nps1" placeholder="01" autocomplete="off"><datalist id="dl-nps1"></datalist></div>
        <div class="field"><input type="text" id="npe1" list="dl-npe1" placeholder="05" autocomplete="off"><datalist id="dl-npe1"></datalist></div>
      </div>
      <div class="next-row">
        <div class="field"><input type="text" id="nn2" list="dl-nn2" placeholder="品名②" autocomplete="off"><datalist id="dl-nn2"></datalist></div>
        <div class="field"><input type="text" id="nps2" list="dl-nps2" placeholder="01" autocomplete="off"><datalist id="dl-nps2"></datalist></div>
        <div class="field"><input type="text" id="npe2" list="dl-npe2" placeholder="05" autocomplete="off"><datalist id="dl-npe2"></datalist></div>
      </div>
      <div class="next-row">
        <div class="field"><input type="text" id="nn3" list="dl-nn3" placeholder="品名③" autocomplete="off"><datalist id="dl-nn3"></datalist></div>
        <div class="field"><input type="text" id="nps3" list="dl-nps3" placeholder="01" autocomplete="off"><datalist id="dl-nps3"></datalist></div>
        <div class="field"><input type="text" id="npe3" list="dl-npe3" placeholder="05" autocomplete="off"><datalist id="dl-npe3"></datalist></div>
      </div>
      <div class="next-row">
        <div class="field"><input type="text" id="nn4" list="dl-nn4" placeholder="品名④" autocomplete="off"><datalist id="dl-nn4"></datalist></div>
        <div class="field"><input type="text" id="nps4" list="dl-nps4" placeholder="01" autocomplete="off"><datalist id="dl-nps4"></datalist></div>
        <div class="field"><input type="text" id="npe4" list="dl-npe4" placeholder="05" autocomplete="off"><datalist id="dl-npe4"></datalist></div>
      </div>
    </div>

    <div class="err" id="err-msg"></div>
    <div class="btn-row">
      <button class="btn-save" id="btn-save" onclick="saveData()">💾 保存・更新</button>
      <button class="btn-reset" onclick="resetForm()">🔄 入力リセット</button>
    </div>
  </div>

  <!-- 閲覧表示（全画面） -->
  <div id="pane-view" class="pane">
    <div class="view-header-bar">
      <div class="view-title-block">
        <h2>🏭 JP-M課 生産リアルタイムボード</h2>
        <div class="sub" id="refreshed-at">接続中…</div>
      </div>
      <div class="view-ctrl">
        <div class="live-dot" id="live-dot" style="display:none"></div>
        <button class="back-btn" onclick="switchTab('input')">← 入力画面</button>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </div>
    <div class="view-grid" id="view-body">
      <div class="empty">読み込み中…</div>
    </div>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK (CDN) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyASiL5-z-DpyDEytgsvBLKYh5ij0jdwuuc",
  authDomain: "seizou-l-mg.firebaseapp.com",
  projectId: "seizou-l-mg",
  storageBucket: "seizou-l-mg.firebasestorage.app",
  messagingSenderId: "309855928656",
  appId: "1:309855928656:web:2ab2c19e3bcb2962836c55",
  measurementId: "G-FT6RG5MVZL"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const COL = "lines"; // Firestoreコレクション名

const MARKS   = ['①','②','③','④'];
const LS_HIST = 'seisan_hist_v2';
const MAX_HIST = 5;

/* ===== Firebase 接続ステータス ===== */
function setStatus(type, msg){
  const el = document.getElementById('fb-status');
  el.className = 'fb-status ' + type;
  el.textContent = msg;
}

/* ===== 履歴（ローカル） ===== */
function getHist(){ try{ return JSON.parse(localStorage.getItem(LS_HIST)||'{}'); }catch(e){ return {}; } }
function addHist(fk,val){
  if(!val) return;
  const h=getHist(); if(!h[fk]) h[fk]=[];
  h[fk]=[val,...h[fk].filter(v=>v!==val)].slice(0,MAX_HIST);
  localStorage.setItem(LS_HIST,JSON.stringify(h));
}
function buildDL(fk,dlId){
  const h=getHist(); const dl=document.getElementById(dlId); if(!dl) return;
  dl.innerHTML='';
  (h[fk]||[]).forEach(v=>{ const o=document.createElement('option'); o.value=v; dl.appendChild(o); });
}
const ALL_FIELDS=[
  ['lineNo','dl-lineNo'],['updater','dl-updater'],
  ['pn1','dl-pn1'],['ps1','dl-ps1'],['pe1','dl-pe1'],
  ['pn2','dl-pn2'],['ps2','dl-ps2'],['pe2','dl-pe2'],
  ['pn3','dl-pn3'],['ps3','dl-ps3'],['pe3','dl-pe3'],
  ['pn4','dl-pn4'],['ps4','dl-ps4'],['pe4','dl-pe4'],
  ['nn1','dl-nn1'],['nps1','dl-nps1'],['npe1','dl-npe1'],
  ['nn2','dl-nn2'],['nps2','dl-nps2'],['npe2','dl-npe2'],
  ['nn3','dl-nn3'],['nps3','dl-nps3'],['npe3','dl-npe3'],
  ['nn4','dl-nn4'],['nps4','dl-nps4'],['npe4','dl-npe4'],
];
function refreshAllDL(){ ALL_FIELDS.forEach(([fk,dl])=>buildDL(fk,dl)); }

/* ===== フォーム操作 ===== */
function v(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function chk(id){ const e=document.getElementById(id); return e?e.checked:false; }
function setV(id,val){ const e=document.getElementById(id); if(e) e.value=val||''; }
function setChk(id,val){ const e=document.getElementById(id); if(e) e.checked=!!val; }

function showBanner(msg){
  const b=document.getElementById('loaded-banner');
  const m=document.getElementById('loaded-msg');
  if(msg){ m.textContent=msg; b.className='loaded-banner show'; }
  else{ b.className='loaded-banner'; }
}
function fillForm(data){
  setV('updater',data.updater);
  const prods=data.prods||[];
  for(let i=0;i<4;i++){
    const p=prods[i]||{};
    setV('pn'+(i+1),p.name); setV('ps'+(i+1),p.start); setV('pe'+(i+1),p.end);
    setChk('c1_'+(i+1),p.check1); setChk('c2_'+(i+1),p.check2);
  }
  const nexts=data.nexts||[];
  for(let i=0;i<4;i++){
    const n=nexts[i]||{};
    setV('nn'+(i+1),n.name); setV('nps'+(i+1),n.start); setV('npe'+(i+1),n.end);
  }
}
function clearProductAndNext(){
  for(let i=1;i<=4;i++){
    setV('pn'+i,''); setV('ps'+i,''); setV('pe'+i,'');
    setChk('c1_'+i,false); setChk('c2_'+i,false);
    setV('nn'+i,''); setV('nps'+i,''); setV('npe'+i,'');
  }
}

/* ライン No. 入力→前回データ自動ロード */
let lineTimer=null;
window.onLineNoInput = function(){
  const lineNo=v('lineNo'); clearTimeout(lineTimer);
  if(!lineNo){ showBanner(''); return; }
  lineTimer=setTimeout(async ()=>{
    try{
      const snap=await getDoc(doc(db,COL,lineNo.replace(/[^a-zA-Z0-9\-_]/g,'_')));
      if(snap.exists()){ fillForm(snap.data()); showBanner('ライン '+lineNo+' の前回入力内容を読み込みました'); }
      else{ clearProductAndNext(); showBanner(''); }
    }catch(e){ clearProductAndNext(); showBanner(''); }
  },400);
};

window.resetForm = function(){
  setV('lineNo',''); setV('updater','');
  clearProductAndNext(); showBanner('');
  document.getElementById('err-msg').className='err';
};

/* ===== 保存 ===== */
function showErr(msg){ const e=document.getElementById('err-msg'); e.textContent=msg; e.className='err'+(msg?' show':''); }
function showToast(msg,ok){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=ok===false?'#c0392b':'#1D9E75';
  t.className='toast show'; setTimeout(()=>t.className='toast',2800);
}

window.saveData = async function(){
  showErr('');
  const lineNo=v('lineNo');
  if(!lineNo){ showErr('ライン No. を入力してください。'); return; }
  const btn=document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='保存中…';

  ALL_FIELDS.forEach(([fk])=>addHist(fk,v(fk)));
  refreshAllDL();

  const prods=[];
  for(let i=1;i<=4;i++) prods.push({name:v('pn'+i),start:v('ps'+i),end:v('pe'+i),check1:chk('c1_'+i),check2:chk('c2_'+i)});
  const nexts=[];
  for(let i=1;i<=4;i++) nexts.push({name:v('nn'+i),start:v('nps'+i),end:v('npe'+i)});

  const data={lineNo,updater:v('updater'),prods,nexts,updatedAt:new Date().toISOString()};
  const docId=lineNo.replace(/[^a-zA-Z0-9\-_]/g,'_');

  try{
    await setDoc(doc(db,COL,docId), data);
    showToast('ライン '+lineNo+' を保存しました ✓',true);
    window.resetForm();
  }catch(e){
    showToast('保存エラー：'+(e.message||String(e)),false);
    showErr('Firebase保存エラー：'+(e.message||String(e)));
  }
  btn.disabled=false; btn.textContent='💾 保存・更新';
};

/* ===== 閲覧（リアルタイム onSnapshot） ===== */
function fmt(iso){
  if(!iso)return'';
  const d=new Date(iso);
  return(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function procLabel(start,end){
  const s=(start||'').trim(),e=(end||'').trim();
  if(!s&&!e) return '—';
  if(!e||s===e) return s||e;
  return s+'〜'+e;
}

function renderLines(lines){
  const el=document.getElementById('view-body');
  if(!lines.length){
    el.innerHTML='<div class="empty" style="grid-column:1/-1">📋 登録データがありません<br><small>情報入力タブからデータを入力してください</small></div>';
    return;
  }
  el.innerHTML=lines.map(l=>{
    const prods=(l.prods||[]).filter(p=>p.name);
    const nexts=(l.nexts||[]).filter(n=>n.name);
    const prodRows=prods.length?prods.map((p,i)=>{
      const proc=procLabel(p.start,p.end);
      return `<tr>
        <td><strong>${MARKS[i]}</strong> ${p.name}</td>
        <td>${proc!=='—'?`<span class="proc-tag">${proc}</span>`:'<span style="color:#3a6090">—</span>'}</td>
        <td>
          <span class="cbadge ${p.check1?'cb-on':'cb-off'}">1回${p.check1?'✓':'—'}</span>
          <span class="cbadge ${p.check2?'cb-on':'cb-off'}">2回${p.check2?'✓':'—'}</span>
        </td>
      </tr>`;
    }).join(''):'<tr><td colspan="3" class="no-data">品名未入力</td></tr>';

    const prodSection=`
      <div class="vl-section">
        <div class="vl-section-title">工程と中間検査</div>
        <table class="prod-table">
          <thead><tr><th>品名</th><th>工程</th><th>中間検査</th></tr></thead>
          <tbody>${prodRows}</tbody>
        </table>
      </div>`;

    const nextSection=nexts.length?`
      <div class="vl-section">
        <div class="vl-section-title">NEXT 生産予定</div>
        <table class="next-table">
          <thead><tr><th>品名</th><th>工程</th></tr></thead>
          <tbody>${nexts.map((n,i)=>{
            const proc=procLabel(n.start,n.end);
            return `<tr>
              <td><strong>${MARKS[i]}</strong> ${n.name}</td>
              <td>${proc!=='—'?`<span class="proc-tag">${proc}</span>`:'<span style="color:#3a6090">—</span>'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`:'';

    return `<div class="vline">
      <div class="vl-hd">
        <span class="vl-no">🏭 ライン ${l.lineNo}</span>
        ${l.updater?`<span class="vl-who">${l.updater}</span>`:''}
        ${l.updatedAt?`<span class="vl-when">${fmt(l.updatedAt)}</span>`:''}
        ${nexts.length?`<span class="vl-next-badge">NEXT ${nexts.length}件</span>`:''}
      </div>
      <div class="vl-body">${prodSection}${nextSection}</div>
    </div>`;
  }).join('');
}

/* Firestore リアルタイムリスナー */
let unsubscribe = null;
function startListener(){
  if(unsubscribe) return;
  const q = query(collection(db,COL));
  unsubscribe = onSnapshot(q,
    (snapshot)=>{
      const lines = [];
      snapshot.forEach(d=>lines.push(d.data()));
      lines.sort((a,b)=>(a.lineNo||'').localeCompare(b.lineNo||'','ja'));
      renderLines(lines);
      document.getElementById('refreshed-at').textContent=
        'LIVE 最終更新：'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      document.getElementById('live-dot').style.display='block';
      setStatus('fb-ok','✅ Firebase リアルタイム接続中');
    },
    (err)=>{
      document.getElementById('refreshed-at').textContent='接続エラー';
      document.getElementById('live-dot').style.display='none';
      setStatus('fb-err','❌ Firebase エラー：'+err.message);
    }
  );
}
function stopListener(){
  if(unsubscribe){ unsubscribe(); unsubscribe=null; }
  document.getElementById('live-dot').style.display='none';
}

/* ===== 時計 ===== */
function updateClock(){
  const el=document.getElementById('clock');
  if(el) el.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000);

/* ===== タブ切替 ===== */
window.switchTab = function(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const btn=document.querySelector(`.tab[onclick="switchTab('${tab}')"]`);
  if(btn) btn.classList.add('active');
  document.getElementById('pane-'+tab).classList.add('active');
  if(tab==='view'){ startListener(); updateClock(); }
  else{ stopListener(); }
};

/* ===== 初期化 ===== */
refreshAllDL();
setStatus('fb-ok','✅ Firebase 接続完了 — リアルタイム共有が有効です');

</script>
</body>
</html>
