<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JP-M課 生産リアルタイムボード</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="生産ボード">
<meta name="theme-color" content="#1D9E75">
<meta name="color-scheme" content="light">


<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{color-scheme:light}
body{font-family:sans-serif;font-size:14px;background:#f0f2f5;color:#222;min-height:100vh}
.header{background:#1D9E75;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.header h1{font-size:16px;font-weight:700}
.header .subtitle{font-size:12px;opacity:.8;margin-top:2px}
.app{max-width:700px;margin:0 auto;padding:12px}
.tab-bar{display:flex;background:#fff;border-radius:10px;padding:4px;gap:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab{flex:1;padding:9px 12px;border:none;background:none;cursor:pointer;font-size:14px;color:#888;border-radius:7px;font-weight:500;transition:all .15s}
.tab.active{background:#1D9E75;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(29,158,117,.35)}
.pane{display:none}
.pane.active{display:block}
.card{border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:13px;font-weight:700;color:#444;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';display:inline-block;width:4px;height:14px;background:#1D9E75;border-radius:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:#888;font-weight:500}
.field input[type=text]{height:36px;padding:0 10px;border:1px solid #d0d0d0;border-radius:7px;font-size:14px;background:#fafafa;width:100%;transition:all .15s}
.field input[type=text]:focus{outline:none;border-color:#1D9E75;background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.field input[type=text][readonly]{background:#f0f0f0;color:#555;cursor:default}
.field-xl{flex:3;min-width:140px}
.field-lg{flex:2;min-width:110px}
.field-sm{flex:1;min-width:75px}
.chk-row{display:flex;align-items:center;gap:16px;margin-top:10px;padding-top:8px;border-top:1px dashed #eee}
.chk-row .chk-label{font-size:12px;color:#888;font-weight:500}
.chk-row label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;color:#333}
.chk-row input[type=checkbox]{width:17px;height:17px;accent-color:#1D9E75;cursor:pointer}
.sec-label{font-size:11px;font-weight:700;color:#1D9E75;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec-label::after{content:'';flex:1;height:1px;background:#d5f0e8}
.next-row-hd{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:3px;padding:0 2px}
.next-row-hd span{font-size:11px;color:#999;font-weight:600}
.next-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:7px}
.btn-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn-save{padding:11px 28px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(29,158,117,.35);transition:all .15s}
.btn-save:hover{background:#168a63}
.btn-save:active{transform:scale(.97)}
.btn-save:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-reset{padding:11px 18px;background:#fff;color:#888;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:#f5f5f5;color:#333;border-color:#bbb}
.err{background:#fee;color:#a00;border:1px solid #fcc;border-radius:8px;padding:9px 13px;margin-top:8px;font-size:13px;display:none}
.err.show{display:block}
.loaded-banner{font-size:12px;color:#0F6E56;background:#E1F5EE;border:1px solid #9FE1CB;border-radius:8px;padding:8px 13px;margin-bottom:10px;display:none;align-items:center;gap:6px}
.loaded-banner.show{display:flex}
.fb-status{font-size:11px;padding:6px 12px;border-radius:7px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fb-ok{background:#E1F5EE;color:#0F6E56;border:1px solid #9FE1CB}
.fb-err{background:#fee;color:#a00;border:1px solid #fcc}
.fb-wait{background:#f5f5f5;color:#888;border:1px solid #ddd}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:9px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999;white-space:nowrap;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* ===== ログイン画面 ===== */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0d2f6e 0%,#1251a3 45%,#0a3d8f 100%);z-index:9000;display:flex;align-items:center;justify-content:center}
#login-screen::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,20,80,.06) 3px,rgba(0,20,80,.06) 4px);pointer-events:none}
.lg-box{position:relative;background:rgba(5,30,90,.80);border:1px solid rgba(120,180,255,.35);border-radius:18px;padding:40px 36px;display:flex;flex-direction:column;align-items:center;gap:18px;width:320px;max-width:92vw}
.lg-logo{font-size:32px}
.lg-title{font-size:16px;font-weight:700;color:#aed8ff;letter-spacing:.06em;text-align:center;line-height:1.5}
.lg-sub{font-size:12px;color:#6a9fd8;letter-spacing:.04em}
.lg-field{width:100%;display:flex;flex-direction:column;gap:5px}
.lg-field label{font-size:12px;color:#7ab2dd;font-weight:600;letter-spacing:.04em}
.lg-field input{height:42px;padding:0 14px;border:1px solid rgba(120,180,255,.35);border-radius:9px;background:rgba(160,210,255,.07);color:#dff0ff;font-size:14px;width:100%;outline:none;transition:all .15s}
.lg-field input::placeholder{color:rgba(160,210,255,.35)}
.lg-field input:focus{border-color:rgba(160,210,255,.7);background:rgba(160,210,255,.12);box-shadow:0 0 0 3px rgba(120,180,255,.15)}
.lg-btn{width:100%;height:44px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.04em;box-shadow:0 3px 12px rgba(29,158,117,.45)}
.lg-btn:hover{background:#168a63}
.lg-btn:active{transform:scale(.97)}
.lg-btn:disabled{opacity:.5;cursor:not-allowed}
.lg-err{font-size:13px;color:#ff8080;min-height:18px;text-align:center;width:100%}
.lg-loading{font-size:13px;color:#6a9fd8;text-align:center;display:none}
@keyframes lgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* ===== 閲覧画面 ===== */
#pane-view{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:linear-gradient(160deg,#0d2f6e 0%,#1251a3 45%,#0a3d8f 100%);
  overflow:hidden;z-index:200;display:none;flex-direction:column;
}
#pane-view.active{display:flex}
#pane-view::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,20,80,.06) 3px,rgba(0,20,80,.06) 4px);pointer-events:none;z-index:0}
.view-header-bar{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:8px 18px;background:rgba(5,30,90,.75);border-bottom:1px solid rgba(120,180,255,.35);flex-shrink:0}
.view-title-block h2{font-size:18px;font-weight:700;color:#aed8ff;letter-spacing:.08em;text-shadow:0 0 16px rgba(160,210,255,.7)}
.view-title-block .sub{font-size:13px;color:#6a9fd8;margin-top:1px;letter-spacing:.04em}
.view-ctrl{display:flex;align-items:center;gap:8px}
.ref-btn{padding:5px 12px;border:1px solid rgba(160,210,255,.45);border-radius:6px;background:rgba(160,210,255,.12);font-size:12px;cursor:pointer;color:#aed8ff;transition:all .15s}
.ref-btn:hover{background:rgba(160,210,255,.25);color:#cceeff}
.ref-btn.manual-on{background:rgba(29,158,117,.35);border-color:rgba(29,200,140,.6);color:#3dffb0}
.back-btn{padding:5px 12px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:rgba(255,255,255,.06);font-size:12px;cursor:pointer;color:#aaa;transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.clock{font-size:30px;font-weight:700;color:#fff;letter-spacing:.12em;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(180,220,255,.9);min-width:120px;text-align:right}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,.7);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ページインジケーター */
.page-indicator{display:flex;gap:6px;align-items:center}
.page-dot{width:8px;height:8px;border-radius:50%;background:rgba(160,210,255,.25);border:1px solid rgba(160,210,255,.4);transition:all .3s;cursor:pointer}
.page-dot.active{background:#aed8ff;box-shadow:0 0 6px rgba(160,210,255,.6)}

/* メインビューを上下分割：行リスト + フロアマップ */
/* view-main：カードリストのコンテナ（flex縦積み） */
.view-main{
  position:relative;z-index:1;
  flex:1;overflow:hidden;
  display:flex;flex-direction:column;
  min-height:0;
}
/* view-page：カード一覧表示エリア */
.view-page{
  flex:1;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;gap:4px;padding:4px;
  background:rgba(120,180,255,.18);
  will-change:opacity;
  transition:opacity 0.6s ease;
  opacity:1;
}
/* floor-map-wrap：pane-view直下の絶対配置オーバーレイ
   view-main の外にあるため renderPage() の DOM操作と完全に独立 */
.floor-map-wrap{
  position:absolute;
  /* view-header-bar の高さ分（約50px）を top に設定 */
  top:0;left:0;right:0;bottom:0;
  z-index:50;
  background:#f5f0e8;
  color-scheme:light;
  display:flex;flex-direction:column;overflow:hidden;
  will-change:opacity;
  transition:opacity 0.6s ease;
  opacity:0;
  pointer-events:none;
}
/* floor-map-title 削除済み */
/* 工場フロア配置図ラベル（左上） */
.floor-map-label{
  position:absolute;top:12px;left:14px;z-index:2;
  display:flex;align-items:center;gap:7px;
  pointer-events:none;
}
.floor-map-label::before{
  content:'';display:inline-block;
  width:3px;height:20px;
  background:#1D9E75;border-radius:2px;flex-shrink:0;
}
.floor-map-label span{
  font-size:14px;font-weight:700;
  color:#6b6050;letter-spacing:.1em;
  text-transform:none;
}
.edit-mode-btn{padding:5px 12px;border:1px solid rgba(160,210,255,.45);border-radius:6px;background:rgba(160,210,255,.12);font-size:12px;cursor:pointer;color:#aed8ff;font-weight:600;transition:all .15s;white-space:nowrap}
.edit-mode-btn:hover{background:rgba(160,210,255,.25);color:#cceeff}
.edit-mode-btn.active{background:rgba(29,158,117,.35);border-color:rgba(29,200,140,.6);color:#3dffb0}
.edit-panel{position:absolute;right:16px;bottom:16px;z-index:200;background:rgba(5,20,60,.95);border:1px solid rgba(120,180,255,.4);border-radius:12px;padding:14px 16px;min-width:180px;box-shadow:0 4px 24px rgba(0,0,0,.5);display:none;flex-direction:column;gap:10px}
.edit-panel.show{display:flex}
.edit-panel-title{font-size:13px;font-weight:700;color:#aed8ff;letter-spacing:.06em;padding-bottom:6px;border-bottom:1px solid rgba(120,180,255,.2)}
.edit-panel-sub{font-size:11px;color:#6a9fd8;margin-top:2px}
.edit-line-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(120,180,255,.1)}
.edit-line-item:last-child{border-bottom:none}
.edit-line-name{font-size:14px;font-weight:600;color:#e0f0ff}
.edit-del-btn{padding:3px 12px;background:rgba(255,80,80,.18);border:1px solid rgba(255,100,100,.4);color:#ff8080;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:all .15s}
.edit-del-btn:hover{background:rgba(255,80,80,.4);color:#fff;border-color:rgba(255,120,120,.7)}
/* 編集オーバーレイ */
.edit-overlay{position:absolute;inset:0;z-index:200;background:rgba(2,10,40,.92);display:none;flex-direction:column;overflow:hidden}
.edit-overlay.show{display:flex}
.edit-overlay-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(10,30,80,.9);border-bottom:1px solid rgba(120,180,255,.3);flex-shrink:0}
.edit-overlay-title{font-size:16px;font-weight:700;color:#aed8ff;letter-spacing:.06em}
.edit-close-btn{padding:5px 16px;border:1px solid rgba(160,210,255,.4);border-radius:6px;background:rgba(160,210,255,.1);color:#aed8ff;font-size:13px;font-weight:600;cursor:pointer}
.edit-close-btn:hover{background:rgba(160,210,255,.25)}
.edit-overlay-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.edit-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(10,30,80,.6);border:1px solid rgba(120,180,255,.15);border-radius:8px}
.edit-row-label{font-size:13px;color:#6a9fd8;width:80px;flex-shrink:0}
.edit-input{flex:1;background:rgba(0,20,60,.7);border:1px solid rgba(120,180,255,.35);border-radius:5px;color:#e0f0ff;font-size:15px;padding:5px 10px;outline:none}
.edit-input:focus{border-color:rgba(120,200,255,.7);background:rgba(0,30,80,.9)}
.edit-save-btn{padding:4px 14px;background:rgba(29,158,117,.3);border:1px solid rgba(29,200,140,.5);color:#3dffb0;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.edit-save-btn:hover{background:rgba(29,158,117,.5)}
.edit-section-title{font-size:12px;font-weight:700;color:#9fd0ff;letter-spacing:.08em;margin-top:8px;padding-bottom:4px;border-bottom:1px solid rgba(120,180,255,.2)}
.floor-map-svg-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
.floor-map-svg-wrap svg{width:100%;height:100%;max-height:100%}
/* ===== フロアマップ アクティブ色フェードイン =====
   アクティブセルの上に水色オーバーレイpolygon(opacity:0)を重ねておき、
   2秒後にJSで svg に .map-revealed を付与 → opacity が 0→1 にtransitionする。
   fillそのものはtransitionできないが、opacityは確実に効く。 */

svg .map-overlay{
  transition: opacity 1.2s ease;
}
svg.map-revealed .map-overlay{
  opacity: 1 !important;
}
svg .map-label-overlay{
  transition: opacity 1.2s ease;
}
svg.map-revealed .map-label-overlay{
  opacity: 1 !important;
}

/* ラインの行 */
.vline{
  background:linear-gradient(90deg,rgba(4,20,70,.92) 0%,rgba(6,28,90,.88) 100%);
  border:1px solid rgba(255,255,255,.5);
  border-radius:4px;
  display:flex;align-items:stretch;overflow:hidden;flex:1;min-height:0;
  box-shadow:inset 0 1px 0 rgba(120,180,255,.1);
}
.vl-hd{
  padding:8px 14px 8px 14px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;flex-wrap:nowrap;
  position:relative;width:auto;flex-shrink:0;
  background:linear-gradient(160deg,rgba(10,55,160,.95) 0%,rgba(5,35,130,.9) 100%);
  border-right:3px solid rgba(255,255,255,.85);
  border-left:5px solid rgba(255,255,255,.95);
  overflow:hidden;
}
.vl-no{font-size:clamp(14px,3.5vw,64px);font-weight:900;color:#fff;letter-spacing:.02em;white-space:nowrap;text-shadow:0 0 18px rgba(160,220,255,1),0 0 30px rgba(100,180,255,.6);line-height:1.1;text-align:center}
.vl-who{font-size:12px;color:#cce8ff;background:rgba(140,200,255,.18);padding:1px 6px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.vl-when{font-size:12px;color:#6aaee0;margin-left:auto;white-space:nowrap;flex-shrink:0}
.vl-del-btn{
  background:rgba(255,80,80,.15);border:1px solid rgba(255,100,100,.35);color:#ff8080;
  border-radius:4px;padding:1px 6px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all .15s;line-height:1.6;position:absolute;top:8px;right:8px;
}
.vl-del-btn:hover{background:rgba(255,80,80,.35);color:#fff;border-color:rgba(255,120,120,.6)}
.vl-card-del-btn{
  display:none;
  background:rgba(255,60,60,.25);border:1px solid rgba(255,100,100,.5);color:#ff8080;
  border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap;
  transition:all .15s;font-weight:700;margin-top:6px;width:100%;
}
.vl-card-del-btn:hover{background:rgba(255,60,60,.55);color:#fff;border-color:rgba(255,120,120,.8)}
.edit-mode-active .vl-card-del-btn{display:block}

/* 統合レイアウト：横並び行 */
.vl-body{padding:2px 8px;flex:1;display:flex;align-items:stretch;gap:4px;min-height:0;overflow:hidden}
.vl-prod-wrap{flex:1;display:flex;flex-direction:column;gap:0;min-height:0;overflow:hidden}
.vl-next-wrap{flex:3;min-height:0;overflow:hidden;display:flex;flex-direction:column;border-left:2px solid rgba(255,255,255,.6);padding-left:6px;max-width:280px}
.next-sep-hd{padding:0 4px;color:#9fd0ff;font-size:11px;font-weight:700;letter-spacing:.06em;flex-shrink:0;line-height:1.6}
/* 稼働品リスト：縦に積む */
.prows-body{flex:1;display:flex;flex-direction:column;gap:0;min-height:0;overflow:hidden}
.vl-next-wrap .prows-body{flex-direction:column;gap:0}
/* 1品名 = 1行：品名 | 工程 | 中間検査 | NEXT生産 の4列グリッド＋縦線 */
/* 工程80px: badge64px+余白8px×2=80px / 中間147px: badge64px×2+gap3px+余白8px×2=147px / NEXT工程80px同様 */
.prow{display:grid;grid-template-columns:30fr 80px 147px 31fr;align-items:stretch;border-bottom:1px solid rgba(255,255,255,.2);min-width:0;flex:1;overflow-x:hidden;overflow-y:visible;}
.prow:last-child{border-bottom:none}
/* 列1: 品名 */
.prow-col-name{display:flex;align-items:center;padding:8px 10px;border-right:1px solid rgba(120,180,255,.3);min-width:0;overflow-x:hidden;overflow-y:visible}
.prow-has-data .prow-col-name{border-right-color:rgba(255,255,255,.85)}
/* 列2: 工程 */
.prow-col-proc{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:0;border-right:1px solid rgba(120,180,255,.3)}
.prow-has-data .prow-col-proc{border-right-color:rgba(255,255,255,.85)}
/* 列3: 中間検査 */
.prow-col-check{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:3px;padding:0;border-right:1px solid rgba(120,180,255,.3)}
.prow-has-data .prow-col-check{border-right-color:rgba(255,255,255,.85)}
/* 列4: NEXT生産 */
.prow-col-next{display:flex;flex-direction:row;align-items:stretch;padding:0;gap:0;min-width:0}
/* 品目4〜5行コンパクト表示：上下余白を縮小して見切れ防止 */
.prow.compact .prow-col-name{padding-top:3px;padding-bottom:3px}
.prow.compact .prow-col-proc{padding:2px 4px;gap:1px}
.prow.compact .prow-col-check{padding:2px 4px;gap:1px}
/* 品名テキスト */
.prow-name{display:flex;align-items:center;gap:4px;color:#e8f4ff;font-weight:600;overflow:hidden;min-width:0}
.prow-name strong{flex-shrink:0;line-height:1.3;white-space:nowrap}
.prow-name .pname-text{font-size:15px !important;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

const FLOOR_GRID_W = 18; // 列数（B〜T相当）

function normLineKey(s){
  return (s||'').toString().toUpperCase().replace(/\s+/g,'').replace(/ー/g,'-');
}

function buildFloorMap(activeLineNos){
  const activeSet = new Set((activeLineNos||[]).map(normLineKey));
  // どのセルがアクティブか判定
  const isActive = (cell)=>{
    if(!cell.match) return false;
    return cell.match.some(m=>{
      const nm = normLineKey(m);
      const nmIsNum = /^[0-9]+$/.test(nm);
      for(const a of activeSet){
        if(a===nm) return true;
        if(nmIsNum){
          // 数値マッチキーは「先頭が数字で始まる」ラインのみ対象
          // 例: "1L","1ライン" → OK / "MC-1","MC1" → 先頭が英字なのでスキップ
          if(!/^[0-9]/.test(a)) continue;
          const aNumOnly = a.replace(/[^0-9]/g,'');
          if(aNumOnly === nm) return true;
          continue;
        }
        if(/^[0-9]+$/.test(a)) continue;
        if(a.includes(nm) || nm.includes(a)) return true;
      }
      return false;
    });
  };

  // 疑似3D: 各セルを台形（上面+前面）で表現。行ブロックごとにY間隔をしっかり空ける。
  const CELL_W = 90, CELL_H = 110;
  const ROW_GAP = 22; // 行ブロック間の縦ギャップ
  const SKEW_X = 22;  // 奥行きによる水平スキュー（疑似3D感）
  const DEPTH = 28;   // 前面の厚み

  // y座標(0,2,3)を実際の行インデックス(0,1,2)に詰める
  const Y_ROWS = [...new Set(FLOOR_CELLS.map(c=>c.y))].sort((a,b)=>a-b);
  function rowIndex(y){ return Y_ROWS.indexOf(y); }

  function cellRect(cell){
    const ri = rowIndex(cell.y);
    const skew = ri * SKEW_X;
    const px = 40 + cell.x*CELL_W + skew;
    const py = 30 + ri*(CELL_H+ROW_GAP);
    const pw = cell.w*CELL_W - 4;
    const ph = CELL_H - 4;
    return {px,py,pw,ph};
  }

  let shapes = '';
  let labels = '';

  FLOOR_CELLS.forEach(cell=>{
    const active = isActive(cell);
    const {px,py,pw,ph} = cellRect(cell);

    // 最初は常に通常色。2秒後にJS側でsvgに.map-revealedを付けてCSSで水色に切替。
    const topFill   = cell.type==='line' ? 'url(#gradLineTop)'   : 'url(#gradAuxTop)';
    const frontFill = cell.type==='line' ? 'url(#gradLineFront)' : 'url(#gradAuxFront)';
    const stroke    = cell.type==='line' ? 'rgba(150,153,165,.8)' : 'rgba(180,175,162,.5)';
    const sw        = 1;

    const topPts = [
      [px, py],
      [px+pw, py],
      [px+pw-6, py+ph-DEPTH],
      [px-6, py+ph-DEPTH]
    ].map(p=>p.join(',')).join(' ');
    const frontPts = [
      [px-6, py+ph-DEPTH],
      [px+pw-6, py+ph-DEPTH],
      [px+pw-6, py+ph],
      [px-6, py+ph]
    ].map(p=>p.join(',')).join(' ');

    const activeAttr = active ? ' data-active="1"' : '';
    shapes += `<polygon points="${topPts}" fill="${topFill}" stroke="${stroke}" stroke-width="${sw}" class="map-top"${activeAttr}/>`;
    shapes += `<polygon points="${frontPts}" fill="${frontFill}" stroke="${stroke}" stroke-width="${sw*0.7}" class="map-front"${activeAttr}/>`;
    if(active){
      // アクティブ色オーバーレイ（opacity:0→1 でフェードイン）
      shapes += `<polygon points="${topPts}" fill="url(#gradActiveTop)" stroke="#ff6600" stroke-width="2.5" class="map-overlay map-overlay-top" opacity="0"/>`;
      shapes += `<polygon points="${frontPts}" fill="url(#gradActiveFront)" stroke="#ff6600" stroke-width="1.75" class="map-overlay map-overlay-front" opacity="0"/>`;
    }
    const cx = px + pw/2 - 3;
    const cy = py + (ph-DEPTH)/2;
    const fontSize = cell.label.length>5 ? 12 : 14;
    const cellIdx = FLOOR_CELLS.indexOf(cell);
    labels += `<text x="${cx.toFixed(1)}" y="${(cy+3).toFixed(1)}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="${cell.type==='line'?'#2a2d3a':'#7a7060'}" data-cellidx="${cellIdx}" class="map-label"${activeAttr} style="cursor:${editPanelOpen?'pointer':'default'}" onclick="inlineEditMapLabel(event,${cellIdx})">${cell.label}</text>`;
    if(active){
      // 白テキストオーバーレイ（フェードイン用）
      labels += `<text x="${cx.toFixed(1)}" y="${(cy+3).toFixed(1)}" text-anchor="middle" font-size="${fontSize}" font-weight="900" fill="#1a0a00" class="map-label-overlay" opacity="0" style="pointer-events:none">${cell.label}</text>`;
    }

  });

  const maxX = Math.max(...FLOOR_CELLS.map(c=>40+c.x*CELL_W + c.y*SKEW_X + c.w*CELL_W));
  const maxY = Math.max(...FLOOR_CELLS.map(c=>30+c.y*(CELL_H+ROW_GAP)+CELL_H));
  const totalW = maxX + 30;
  const totalH = maxY + 30;

  return `<svg viewBox="0 0 ${totalW.toFixed(0)} ${totalH.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" style="background:#f5f0e8">
    <defs>
      <!-- ラインBOX上面：ライトグレー -->
      <linearGradient id="gradLineTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(210,212,218,1)"/>
        <stop offset="1" stop-color="rgba(185,188,196,1)"/>
      </linearGradient>
      <!-- ラインBOX前面：やや濃いグレー（立体感） -->
      <linearGradient id="gradLineFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(160,163,172,1)"/>
        <stop offset="1" stop-color="rgba(140,143,152,1)"/>
      </linearGradient>
      <!-- アクティブ上面：セーフティオレンジ -->
      <linearGradient id="gradActiveTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(255,165,0,1)"/>
        <stop offset="1" stop-color="rgba(255,103,0,1)"/>
      </linearGradient>
      <!-- アクティブ前面：セーフティオレンジ（濃） -->
      <linearGradient id="gradActiveFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(220,88,0,1)"/>
        <stop offset="1" stop-color="rgba(180,60,0,1)"/>
      </linearGradient>
      <!-- セーフティオレンジ発光フィルター -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feFlood flood-color="rgba(255,120,0,.7)" result="color"/>
        <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
        <feMerge><feMergeNode in="colorBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- 補助エリア上面：クリーム寄りの薄いグレー -->
      <linearGradient id="gradAuxTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(232,228,218,.75)"/>
        <stop offset="1" stop-color="rgba(215,210,198,.75)"/>
      </linearGradient>
      <!-- 補助エリア前面 -->
      <linearGradient id="gradAuxFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(200,196,184,.8)"/>
        <stop offset="1" stop-color="rgba(185,180,168,.8)"/>
      </linearGradient>
    </defs>
    ${shapes}
    ${labels}
  </svg>`;
}

function renderFloorMap(){
  const wrap = document.getElementById('floor-map-svg-wrap');
  if(!wrap) return;
  // 現在表示中のページのラインだけ光らせる
  const totalPages = Math.ceil(allLines.length/PAGE_SIZE)||1;
  const pi = ((currentPage%totalPages)+totalPages)%totalPages;
  const slice = allLines.slice(pi*PAGE_SIZE,(pi+1)*PAGE_SIZE);
  const activeLineNos = slice.map(l=>l.lineNo).filter(Boolean);
  wrap.innerHTML = buildFloorMap(activeLineNos);
}

/* ライン No. 入力→前回データ自動ロード
   ラインNoが変わるたびに毎回Firestoreを検索。
   既存データがあれば読み込み、なければ空欄のまま新規入力モード。
   これにより「ムラタ→リセット→シミズ」と入力し直した場合、
   シミズの既存データ（あれば）を正しくロードし、
   保存時はシミズのドキュメントに書き込む。 */
let lineTimer=null;
let prevLineNo=''; // 直前のラインNo（変化検知用）

window.onLineNoInput = function(){
  const lineNo=getLineNoValue();
  clearTimeout(lineTimer);
  showBanner('');
  if(!lineNo){
    prevLineNo='';
    clearProductAndNext();
    return;
  }
  // 同じ値が連続して来た場合（IME確定など）はスキップ
  if(lineNo===prevLineNo) return;
  prevLineNo=lineNo;
  // 入力が変わったら即クリア→500ms後にFirestore検索
  clearProductAndNext();
  lineTimer=setTimeout(async ()=>{
    try{
      const snap=await getDoc(doc(db,COL,toDocId(lineNo)));
      if(snap.exists()){
        fillForm(snap.data());
        showBanner('ライン '+lineNo+' の既存データを読み込みました（上書き更新モード）');
      } else {
        showBanner('新規ライン '+lineNo+' として登録します');
      }
    }catch(e){}
  },500);
};

function toDocId(lineNo){
  // Firestoreのドキュメントは日本語を含むUnicode文字が有効です
  // 無効な文字はスラッシュ(/)のみのため、スラッシュだけを置換します
  let id = lineNo.replace(/\//g, '_');
  // Firestoreで予約済みの '.' '..' を回避
  if(id === '.' || id === '..') id = '_' + id;
  return id;
}

window.inlineEditCell = function(e, docId, rowIdx, field, cellEl){
  if(!editPanelOpen) return;
  e.stopPropagation();
  if(cellEl.querySelector('input,select')) return;

  // フィールド設定
  const isProc = field==='proc'||field==='nproc'; // 工程（start〜end）
  const isPname = field==='pname';
  const isNname = field==='nname';

  // 現在の値を取得
  const lineData = allLines.find(l=>(l._id||toDocId(l.lineNo))===docId);
  if(!lineData) return;
  const prods = lineData.prods||[];
  const nexts = lineData.nexts||[];

  let currentVal = '';
  if(field==='pname') currentVal = (prods[rowIdx]||{}).name||'';
  if(field==='proc'){ const p=prods[rowIdx]||{}; currentVal = procLabel(p.start,p.end); }
  if(field==='nname') currentVal = (nexts[rowIdx]||{}).name||'';
  if(field==='nproc'){ const n=nexts[rowIdx]||{}; currentVal = procLabel(n.start,n.end); }

  // インライン入力欄生成
  cellEl.style.position='relative';
  const inp = document.createElement('input');
  inp.value = currentVal;
  inp.style.cssText='position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;background:rgba(0,20,60,.95);border:2px solid rgba(100,200,255,.8);border-radius:4px;color:#e0f0ff;font-size:14px;padding:2px 8px;outline:none;z-index:10;';
  cellEl.appendChild(inp);
  inp.focus(); inp.select();

  const cancel = ()=>{ inp.remove(); cellEl.style.position=''; };
  const save = async ()=>{
    const newVal = inp.value.trim();
    inp.remove(); cellEl.style.position='';
    try{
      const snap = await getDoc(doc(db,COL,docId));
      if(!snap.exists()) return;
      const data = snap.data();
      const prods2 = data.prods ? [...data.prods] : [];
      const nexts2 = data.nexts ? [...data.nexts] : [];
      while(prods2.length<=rowIdx) prods2.push({});
      while(nexts2.length<=rowIdx) nexts2.push({});

      if(field==='pname'){ prods2[rowIdx]={...prods2[rowIdx],name:newVal}; }
      if(field==='proc'){
        // "1〜3" or "1" 形式をstart/endに分解
        const parts = newVal.split(/[〜~]/);
        prods2[rowIdx]={...prods2[rowIdx],start:parts[0]||'',end:parts[1]||''};
      }
      if(field==='nname'){ nexts2[rowIdx]={...nexts2[rowIdx],name:newVal}; }
      if(field==='nproc'){
        const parts = newVal.split(/[〜~]/);
        nexts2[rowIdx]={...nexts2[rowIdx],start:parts[0]||'',end:parts[1]||''};
      }
      await setDoc(doc(db,COL,docId),{...data,prods:prods2,nexts:nexts2,updatedAt:new Date().toISOString()});
      showToast('保存しました',true);
    }catch(err){ showToast('エラー：'+err.message,false); }
  };

  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();save();}
    if(ev.key==='Escape'){cancel();}
  });
  inp.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==inp) cancel();},150));
};

/* ===== ソート関数（数値昇順→文字列後尾） ===== */
function sortLines(lines){
  return [...lines].sort((a,b)=>{
    const aNo=(a.lineNo||'').trim(), bNo=(b.lineNo||'').trim();
    // 先頭の数値部分を抽出（例: "23L"→23, "A-01"→NaN）
    const aMatch=aNo.match(/^(\d+)/), bMatch=bNo.match(/^(\d+)/);
    const aNum=aMatch?parseInt(aMatch[1],10):NaN;
    const bNum=bMatch?parseInt(bMatch[1],10):NaN;
    const aHasNum=!isNaN(aNum), bHasNum=!isNaN(bNum);
    if(aHasNum&&bHasNum){
      if(aNum!==bNum) return aNum-bNum;
      return aNo.localeCompare(bNo,'ja',{numeric:true});
    }
    if(aHasNum) return -1;
    if(bHasNum) return 1;
    return aNo.localeCompare(bNo,'ja',{numeric:true});
  });
}

/* ===== 閲覧レンダリング ===== */
function fmt(iso){
  if(!iso)return'';
  const d=new Date(iso);
  return(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function procLabel(start,end){
  const s=(start||'').trim(),e=(end||'').trim();
  if(!s&&!e) return '';
  if(!e||s===e) return s||e;
  return s+'〜'+e;
}

function renderPageDots(pi,total){
  const el=document.getElementById('page-indicator');
  if(!el) return;
  el.innerHTML='';
  if(total<=1 && !manualMode) return;

  // 手動モード時は ◀ ドット… ▶ の前後ボタン付き
  if(manualMode){
    const prev=document.createElement('button');
    prev.textContent='◀';
    prev.style.cssText='background:rgba(160,210,255,.15);border:1px solid rgba(160,210,255,.4);color:#aed8ff;border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer;margin-right:4px;';
    prev.onclick=()=>{
      const t=Math.ceil(allLines.length/PAGE_SIZE)||1;
      currentPage=((currentPage-1)+t)%t;
      cinemPage=currentPage;
      renderPage(currentPage);
    };
    el.appendChild(prev);
  }

  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='page-dot'+(i===pi?' active':'');
    d.onclick=(()=>{const idx=i; return ()=>{
      stopCinematic();
      currentPage=idx; cinemPage=idx;
      renderPage(idx);
      if(!manualMode && PAGE_SIZE<9999 && window.innerWidth>600) startCinematic();
    };})();
    el.appendChild(d);
  }

  if(manualMode){
    const next=document.createElement('button');
    next.textContent='▶';
    next.style.cssText='background:rgba(160,210,255,.15);border:1px solid rgba(160,210,255,.4);color:#aed8ff;border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer;margin-left:4px;';
    next.onclick=()=>{
      const t=Math.ceil(allLines.length/PAGE_SIZE)||1;
      currentPage=(currentPage+1)%t;
      cinemPage=currentPage;
      renderPage(currentPage);
    };
    el.appendChild(next);
  }
}

/* ===== シネマティック閲覧ループ ===== */
/* アクティブセルのバウンディングボックスを計算 */
function getActiveCellsBBox(activeLineNos){
  const CELL_W=90,CELL_H=75,ROW_GAP=12,SKEW_X=18;
  const activeSet=new Set((activeLineNos||[]).map(normLineKey));
  const Y_ROWS=[...new Set(FLOOR_CELLS.map(c=>c.y))].sort((a,b)=>a-b);
  const ri=y=>Y_ROWS.indexOf(y);
  const hits=FLOOR_CELLS.filter(cell=>{
    if(!cell.match) return false;
    return cell.match.some(m=>{
      const nm=normLineKey(m),nmN=/^[0-9]+$/.test(nm);
      for(const a of activeSet){
        if(a===nm) return true;
        if(nmN){if(a.replace(/[^0-9]/g,'')===nm) return true;continue;}
        if(/^[0-9]+$/.test(a)) continue;
        if(a.includes(nm)||nm.includes(a)) return true;
      }
      return false;
    });
  });
  if(!hits.length) return null;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  hits.forEach(cell=>{
    const r=ri(cell.y);
    const px=40+cell.x*CELL_W+r*SKEW_X, py=30+r*(CELL_H+ROW_GAP);
    x0=Math.min(x0,px-6);  y0=Math.min(y0,py-6);
    x1=Math.max(x1,px+cell.w*CELL_W-4+6); y1=Math.max(y1,py+CELL_H-4+6);
  });
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

/* SVG viewBox アニメーション */
function stopSvgZoom(){if(svgZoomRaf){cancelAnimationFrame(svgZoomRaf);svgZoomRaf=null;}}
function animateViewBox(svg,from,to,dur,onDone){
  stopSvgZoom();
  const t0=performance.now();
  function step(now){
    if(!svg.isConnected){svgZoomRaf=null;return;}
    let t=Math.min((now-t0)/dur,1);
    t=t<.5?2*t*t:-1+(4-2*t)*t; // ease-in-out
    const vx=from.x+(to.x-from.x)*t, vy=from.y+(to.y-from.y)*t;
    const vw=from.w+(to.w-from.w)*t, vh=from.h+(to.h-from.h)*t;
    svg.setAttribute('viewBox',[vx,vy,vw,vh].map(v=>v.toFixed(1)).join(' '));
    if(t<1) svgZoomRaf=requestAnimationFrame(step);
    else{svgZoomRaf=null;if(onDone)onDone();}
  }
  svgZoomRaf=requestAnimationFrame(step);
}

/* シネマティックモード停止 */
function stopCinematic(){
  stopSvgZoom();
  if(cinemTimer){clearTimeout(cinemTimer);cinemTimer=null;}
  const pv=document.getElementById('pane-view');
  if(pv){pv.classList.remove('cine-map','cine-cards');}
}

/* シネマティックモード開始（デスクトップ・自動モードのみ） */
function startCinematic(){
  if(window.innerWidth<=600) return;
  if(manualMode) return;
  stopCinematic();
  const total=Math.ceil(allLines.length/PAGE_SIZE)||1;
  cinemPage=total>1 ? (currentPage+1)%total : 0;
  runCinematicLoop();
}

/* シネマティックループ本体
   Phase1(マップ全画面, 5.5秒) → Phase2(カード, 15秒) → 次ページのPhase1…
   ページは 0→1→2→…→(total-1)→0 と必ず順番に進む。

   ガクつき防止のポイント：
   ① cine-map/cine-cards の付け外しは必ず「1フレーム空け」
   ② renderPage() は cine-map 付与前（DOM差し替えをトランジション外）に実行
   ③ マップ→カード切替は、cine-map を外した瞬間に view-page が
      opacity:0→1 のトランジションを開始するため、その間（1.1s）は何もしない
   ④ カードのアニメーション遅延は cine-cards 付与後にセットして
      トランジション完了タイミングと合わせる
*/
function runCinematicLoop(){
  const pv=document.getElementById('pane-view');
  if(!pv||!pv.classList.contains('active')) return;
  if(manualMode) return;

  const total=Math.ceil(allLines.length/PAGE_SIZE)||1;
  const pi=((cinemPage%total)+total)%total;
  cinemPage=pi;
  currentPage=pi;

  // ── Phase1: マップを表示 ──────────────────────────────────
  // A: SVGハイライトを即消去
  const svgNow=document.querySelector('#floor-map-svg-wrap svg');
  if(svgNow){
    svgNow.classList.remove('map-revealed');
    svgNow.querySelectorAll('.map-overlay,.map-label-overlay').forEach(el=>{
      el.style.transition='none';
      el.style.opacity='0';
    });
  }

  // B: cine-cards を外してから cine-map を付与
  //    → floor-map-wrap: opacity 0→1 (0.6s)
  //    → view-page:      opacity 1→0 (0.6s)
  pv.classList.remove('cine-cards');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      pv.classList.add('cine-map');
      // C: view-page を JS で即座に非表示にしてからDOMを差し替える
      //    （CSSトランジション開始直後は opacity がまだ1に近いため、
      //     インラインスタイルで強制的に0にしてフラッシュを防ぐ）
      const viewPage=document.getElementById('view-body');
      if(viewPage){
        viewPage.style.transition='none';
        viewPage.style.opacity='0';
      }
      renderPage(pi);
      // 次フレームでインラインスタイルを解除（以降はCSSの!importantに委ねる）
      requestAnimationFrame(()=>{
        if(viewPage){ viewPage.style.transition=''; viewPage.style.opacity=''; }
      });
      // D: トランジション完了(0.7s)後にアクティブセルをフェードイン
      setTimeout(()=>{
        const svg2=document.querySelector('#floor-map-svg-wrap svg');
        if(svg2) svg2.classList.add('map-revealed');
      }, 750);
    });
  });

  // ── Phase2(5.5秒後): カードを表示 ──────────────────────────
  cinemTimer=setTimeout(()=>{
    cinemTimer=null;

    // E: cine-map を外し cine-cards を付与
    //    → floor-map-wrap: opacity 1→0 (0.6s)
    //    → view-page:      opacity 0→1 (0.6s) + cardFadeIn アニメーション
    pv.classList.remove('cine-map');
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        pv.classList.add('cine-cards');
        fitPnameTexts();
        // カード毎に段階的な遅延
        document.querySelectorAll('#view-body .vline').forEach((vline,i)=>{
          vline.style.animationDelay='0s';
        });
      });
    });

    // ── Phase2終了(15秒後) → 次ページへ ──
    cinemTimer=setTimeout(()=>{
      cinemTimer=null;
      const newTotal=Math.ceil(allLines.length/PAGE_SIZE)||1;
      cinemPage=(pi+1)%newTotal;
      runCinematicLoop();
    },15000);

  },5500);
}

/* 自動/手動モード切替 */
window.toggleManualMode=function(){
  manualMode=!manualMode;
  const btn=document.getElementById('auto-manual-btn');
  const pv=document.getElementById('pane-view');
  const editBtn=document.getElementById('edit-mode-btn');
  if(manualMode){
    stopCinematic();
    if(btn){ btn.textContent=' 自動'; btn.classList.add('manual-on'); }
    // 手動モード：カードを表示・マップを非表示
    if(pv){ pv.classList.remove('cine-map'); pv.classList.add('cine-cards'); }
    // 編集ボタンを表示
    if(editBtn) editBtn.style.display='inline-block';
    renderPage(currentPage);
  } else {
    if(btn){ btn.textContent=' 手動'; btn.classList.remove('manual-on'); }
    if(pv){ pv.classList.remove('cine-map','cine-cards'); }
    // 編集ボタンを非表示
    if(editBtn) editBtn.style.display='none';
    if(PAGE_SIZE<9999&&window.innerWidth>600) startCinematic();
  }
};

/* ===== ページサイズ変更 ===== */
window.changePageSize = function(val){
  PAGE_SIZE = parseInt(val, 10);
  currentPage = 0;
  cinemPage = 0;
  stopCinematic();
  renderPage(0);
  // 手動モード・全ライン表示・モバイルはシネマティックなし
  if(!manualMode && PAGE_SIZE < 9999 && window.innerWidth > 600) startCinematic();
};

function renderLines(lines){
  // 同じlineNoを持つドキュメントが複数存在する場合（旧形式IDと新形式IDの共存等）、
  // updatedAtが新しい方を優先して重複を除去し、同じラインが連続表示されるのを防ぐ
  const seen = new Map();
  for(const l of lines){
    const key = (l.lineNo||'').trim();
    if(!key) continue;
    const existing = seen.get(key);
    if(!existing || (l.updatedAt||'') > (existing.updatedAt||'')){
      seen.set(key, l);
    }
  }
  allLines=sortLines([...seen.values()]);
  calcGlobalHdWidth(); // 全ページ通じた統一幅をここで計算
  updateLineNoSelect(); // ラインNo.セレクトを最新ラインリストで更新
  renderMobLineFilter();
  if(editPanelOpen){ renderPage(currentPage); renderEditPanel(); return; }
  // 手動モード中は常にcurrentPageで再描画
  if(manualMode){ renderPage(currentPage); return; }
  // シネマティック中はページ・フェーズを乱さない
  if(cinemTimer != null){
    // 現在のcinemPageでデータだけ静かに再描画（クラスは変えない）
    renderPage(cinemPage);
    // cine-cards フェーズ中は再描画で新 .vline に cardSlideIn が
    // 即トリガーされてしまうため、animation を none で抑制して即表示させる
    const _pv = document.getElementById('pane-view');
    if(_pv && _pv.classList.contains('cine-cards')){
      document.querySelectorAll('#view-body .vline').forEach(v=>{
        v.style.animation = 'none';
        v.style.opacity   = '1';
        v.style.transform = 'none';
      });
    }
  } else {
    renderPage(currentPage);
  }
}
/* 全ページ・全ラインを通じた vl-hd 統一幅をキャッシュ */
let _cachedHdWidth = 0;

/* allLines 全体から最長ラインNo表示テキストを測定して幅をキャッシュ */
function calcGlobalHdWidth(){
  if(!allLines.length){ _cachedHdWidth = 0; return; }

  // オフスクリーン計測用コンテナを一時生成（実際の.vl-noと同じスタイル）
  const ruler = document.createElement('div');
  ruler.style.cssText = [
    'position:absolute','visibility:hidden','pointer-events:none',
    'top:-9999px','left:-9999px',
    'display:flex','flex-direction:column','align-items:center',
    'padding:8px 14px','gap:4px',
    'background:transparent','white-space:nowrap',
  ].join(';');
  document.body.appendChild(ruler);

  // 現在の.vl-noのフォントサイズを取得（clamp値はブラウザが解決済み）
  const sampleNo = document.querySelector('.vl-no');
  const fs = sampleNo ? window.getComputedStyle(sampleNo).fontSize : '40px';

  let maxW = 0;
  allLines.forEach(l=>{
    const lineNo = l.lineNo || '';
    const display = /^\d+$/.test(lineNo) ? lineNo + 'L' : lineNo;
    // ライン番号テキスト
    const noEl = document.createElement('span');
    noEl.style.cssText = `font-size:${fs};font-weight:900;letter-spacing:.02em;white-space:nowrap;display:block`;
    noEl.textContent = display;
    // 担当者テキスト（vl-who: padding 1px 6px）
    const whoEl = document.createElement('span');
    whoEl.style.cssText = 'font-size:12px;white-space:nowrap;padding:1px 6px;display:block';
    whoEl.textContent = l.updater || '';

    ruler.innerHTML = '';
    ruler.appendChild(noEl);
    if(l.updater) ruler.appendChild(whoEl);

    const w = ruler.scrollWidth + 28; // padding 14px×2
    if(w > maxW) maxW = w;
  });

  document.body.removeChild(ruler);
  _cachedHdWidth = maxW;
}

function fitLineNos(){
  if(!_cachedHdWidth) return;
  requestAnimationFrame(()=>{
    // 現在ページの全 vl-hd を統一幅にセット
    document.querySelectorAll('#view-body .vl-hd').forEach(hd=>{
      hd.style.width = _cachedHdWidth + 'px';
    });
    // ヘッダーの「ライン」列も同幅に（vl-hdと同じwidth/min/maxで完全一致）
    const hdCol = document.getElementById('hd-line-col');
    if(hdCol){
      hdCol.style.width = _cachedHdWidth + 'px';
      hdCol.style.minWidth = _cachedHdWidth + 'px';
      hdCol.style.maxWidth = _cachedHdWidth + 'px';
      hdCol.style.flexShrink = '0';
    }
  });
}

/* ===== 旧形式ドキュメントID自動マイグレーション =====
   旧コードでは日本語ライン名が "___" に変換されて保存されていた。
   ログイン時に一度だけ実行し、IDが正しくないドキュメントを整理する。 */
async function migrateOldDocIds(){
  try{
    const snapshot = await getDocs(query(collection(db,COL)));
    for(const d of snapshot.docs){
      const data = d.data();
      const lineNo = data.lineNo || '';
      if(!lineNo) continue;
      const correctId = toDocId(lineNo);
      if(d.id === correctId) continue; // 正常なIDはスキップ

      // 正しいIDのドキュメントが既に存在するか確認
      const existingSnap = await getDoc(doc(db,COL,correctId));
      if(existingSnap.exists()){
        // 正しいIDのドキュメントが既にある → 古い方だけ削除
        await deleteDoc(doc(db,COL,d.id));
        console.log('[Migration] 重複旧ドキュメント削除:', d.id, '→ 保持:', correctId);
      } else {
        // 正しいIDのドキュメントが無い → データを正しいIDに移動
        await setDoc(doc(db,COL,correctId), data);
        await deleteDoc(doc(db,COL,d.id));
        console.log('[Migration] ドキュメントID修正:', d.id, '→', correctId);
      }
    }
  }catch(e){
    console.warn('[Migration] エラー:', e);
  }
}

/* ===== Firestore リアルタイムリスナー ===== */
let unsubscribe=null;
/* ===== 入力タブ用の常時ラインリスナー =====
   閲覧タブを開かなくても、ログイン直後からドロップダウンにラインを反映させる。
   startListener()（閲覧用）と共存する。閲覧用が起動すると同じsnapshotで
   allLinesが更新されるため、両者で二重更新になってもupdateLineNoSelectは冪等。 */
let inputUnsubscribe = null;

function startInputListener(){
  if(inputUnsubscribe) return; // 既に起動中
  const q = query(collection(db, COL));
  inputUnsubscribe = onSnapshot(q,
    (snapshot) => {
      const lines = [];
      snapshot.forEach(d => lines.push({...d.data(), _id: d.id}));
      // allLines を更新してドロップダウンを再構築（閲覧タブのrenderLinesとは独立）
      const seen = new Map();
      for(const l of lines){
        const key = (l.lineNo||'').trim();
        if(!key) continue;
        const existing = seen.get(key);
        if(!existing || (l.updatedAt||'') > (existing.updatedAt||'')){
          seen.set(key, l);
        }
      }
      allLines = sortLines([...seen.values()]);
      updateLineNoSelect();
    },
    (err) => { console.warn('[inputListener]', err.message); }
  );
}

function stopInputListener(){
  if(inputUnsubscribe){ inputUnsubscribe(); inputUnsubscribe=null; }
}

function startListener(){
  if(unsubscribe) return;
  const q=query(collection(db,COL));
  unsubscribe=onSnapshot(q,
    (snapshot)=>{
      const lines=[];
      // 実際のFirestoreドキュメントIDも保持する（正確な削除のため）
      snapshot.forEach(d=>lines.push({...d.data(), _id: d.id}));
      renderLines(lines);
      document.getElementById('refreshed-at').textContent=
        'LIVE 最終更新：'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      document.getElementById('live-dot').style.display='block';
      setStatus('fb-ok','✅ Firebase リアルタイム接続中');
    },
    (err)=>{
      document.getElementById('refreshed-at').textContent='接続エラー';
      document.getElementById('live-dot').style.display='none';
      setStatus('fb-err','❌ Firebase エラー：'+err.message);
    }
  );
}
function stopListener(){
  if(unsubscribe){ unsubscribe(); unsubscribe=null; }
  document.getElementById('live-dot').style.display='none';
  stopPageTimer();
}

/* ===== 時計 ===== */
// メモリ上のリセット済み日付（アプリ起動中の2重実行防止用）
let _lastResetDate = '';

/* Firestoreから最終リセット日を取得 */
async function getLastResetDate(){
  try{
    const snap = await getDoc(doc(db, COL_CONFIG, DOC_RESET));
    return snap.exists() ? (snap.data().lastResetDate || '') : '';
  }catch(e){
    console.warn('[リセット日取得失敗]', e);
    return '';
  }
}

/* Firestoreに最終リセット日を保存 */
async function saveLastResetDate(dateStr){
  try{
    await setDoc(doc(db, COL_CONFIG, DOC_RESET), { lastResetDate: dateStr });
  }catch(e){
    console.warn('[リセット日保存失敗]', e);
  }
}

/* 全ラインの中間検査チェックをリセットしてFirestoreへ保存 */
async function resetAllChecks(){
  const snap = await getDocs(query(collection(db, COL)));
  const writes = [];
  snap.forEach(d=>{
    const data = d.data();
    const prods = (data.prods||[]).map(p=>({...p, check1:false, check2:false}));
    if(JSON.stringify(prods)!==JSON.stringify(data.prods||[])){
      writes.push(setDoc(doc(db, COL, d.id), {...data, prods, updatedAt:new Date().toISOString()}));
    }
  });
  if(writes.length){
    await Promise.all(writes);
    console.log('[18:00リセット] 中間検査チェックをリセットしました:', new Date().toLocaleString('ja-JP'));
    showToast('🔄 18:00 中間検査チェックをリセットしました', true);
  }
  // リセット日をFirestoreに保存（アプリが閉じていても次回起動時に参照できる）
  const todayStr = new Date().toISOString().slice(0,10);
  _lastResetDate = todayStr;
  await saveLastResetDate(todayStr);
}

/* ログイン時に「18:00を過ぎているのに未リセット」なら自動実行
   アプリを閉じていた・ログアウトしていた場合もこれで補完する */
async function checkAndResetOnLogin(){
  if(!currentUser) return;
  const now = new Date();
  const h = now.getHours();
  // 18:00未満はリセット不要
  if(h < 18) return;

  const todayStr = now.toISOString().slice(0,10);
  // メモリにすでに記録があればスキップ（同セッション内の2重実行防止）
  if(_lastResetDate === todayStr) return;

  // Firestoreの最終リセット日を確認
  const lastReset = await getLastResetDate();
  _lastResetDate = lastReset; // メモリをFirestoreと同期

  if(lastReset === todayStr){
    console.log('[起動時チェック] 本日分はリセット済みです');
    return;
  }

  // 未リセットなので実行
  console.log('[起動時リセット] 前回リセット日:', lastReset, '→ 本日分リセット実行');
  resetAllChecks().catch(e=>console.warn('[起動時リセット失敗]', e));
}

function updateClock(){
  const el=document.getElementById('clock');
  const now=new Date();
  if(el) el.textContent=now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  // 18:00:00 ちょうどにアプリが開いていた場合のリアルタイムリセット（1日1回のみ）
  const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  const todayStr=now.toISOString().slice(0,10);
  if(h===18 && m===0 && s===0 && _lastResetDate!==todayStr && currentUser){
    _lastResetDate=todayStr;
    resetAllChecks().catch(e=>console.warn('[リセット失敗]',e));
  }
}
setInterval(updateClock,1000);

/* ===== タブ切替 ===== */
function renderMobLineFilter(){
  const bar = document.getElementById('mob-line-filter');
  const btns = document.getElementById('mob-line-btns');
  if(!bar||!btns) return;
  if(window.innerWidth>600){ bar.style.display='none'; return; }
  bar.style.display='block';
  btns.innerHTML = allLines.map(l=>{
    const id = l._id||toDocId(l.lineNo);
    const on = mobSelectedLines.has(id);
    return `<button onclick="toggleMobLine('${id}')" style="
      display:inline-block;margin:0 3px;padding:3px 10px;border-radius:14px;
      font-size:12px;font-weight:700;cursor:pointer;vertical-align:middle;
      border:1.5px solid ${on?'#7dd3fc':'rgba(100,160,255,.35)'};
      background:${on?'rgba(80,180,255,.25)':'rgba(0,20,60,.5)'};
      color:${on?'#7dd3fc':'rgba(160,200,255,.6)'};
    ">${l.lineNo||id}</button>`;
  }).join('');
}
window.toggleMobLine=function(id){
  if(mobSelectedLines.has(id)) mobSelectedLines.delete(id);
  else mobSelectedLines.add(id);
  saveMobSel();
  renderMobLineFilter();
  renderPage(0);
}
window.switchTab=function(tab){
  if(tab==='view') setTimeout(renderMobLineFilter, 50);
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const btn=document.querySelector(`.tab[onclick="switchTab('${tab}')"]`);
  if(btn) btn.classList.add('active');
  document.getElementById('pane-'+tab).classList.add('active');
  if(tab==='view'){
    startListener(); updateClock();
    if(manualMode){
      // 手動モード復元：マップ非表示・カード全画面
      const _pvTab=document.getElementById('pane-view');
      if(_pvTab){ _pvTab.classList.remove('cine-map'); _pvTab.classList.add('cine-cards'); }
      renderPage(currentPage);
    } else {
      startCinematic();
    }
    window.addEventListener('resize', fitPnameTexts);
    window.addEventListener('resize', ()=>{ calcGlobalHdWidth(); fitLineNos(); });
  } else { stopListener(); stopCinematic(); window.removeEventListener('resize', fitPnameTexts); }
};

/* ===== ログイン / ログアウト ===== */
window.doLogin=async function(){
  const employeeId=document.getElementById('lg-email').value.trim();
  const pass=document.getElementById('lg-pass').value;
  const errEl=document.getElementById('lg-err');
  const btn=document.getElementById('lg-btn');
  const loading=document.getElementById('lg-loading');
  errEl.textContent='';
  if(!employeeId||!pass){ errEl.textContent='社員番号とパスワードを入力してください'; return; }
  btn.disabled=true; loading.style.display='block';
  try{
    // 社員番号から email を生成して Firebase Authentication 認証
    const email=`${employeeId}@factory.local`;
    await signInWithEmailAndPassword(auth,email,pass);
    // ログイン成功 → onAuthStateChangedがworkerを表示
  }catch(e){
    let msg='ログインに失敗しました';
    if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') msg='パスワードが正しくありません';
    else if(e.code==='auth/too-many-requests') msg='ログイン試行が多すぎます。しばらく待ってください';
    else if(e.code==='auth/user-not-found') msg='社員番号が存在しません';
    errEl.textContent=msg;
    document.querySelector('.lg-box').style.animation='lgShake .4s ease';
    setTimeout(()=>document.querySelector('.lg-box').style.animation='',500);
  }
  btn.disabled=false; loading.style.display='none';
};

window.doLogout=async function(){
  stopListener();
  await signOut(auth);
};

document.getElementById('lg-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') window.doLogin(); });
document.getElementById('lg-email').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lg-pass').focus(); });

/* ===== 認証状態の監視 ===== */
onAuthStateChanged(auth,user=>{
  if(user){
    currentUser=user;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-app').style.display='block';
    // メールアドレス（360@factory.local）から社員番号を取得
    const emailId = user.email||'';
    const employeeId = emailId.includes('@') ? emailId.split('@')[0] : (document.getElementById('lg-email').value.trim());
    // 暫定表示：社員番号をそのまま表示（Firestore取得完了まで）
    document.getElementById('updater').value=employeeId;
    document.getElementById('user-email-disp').textContent=employeeId;
    // Firestoreのusers/{employeeId}からworkerを取得して表示
    if(employeeId){
      getDoc(doc(db,COL_USERS,employeeId)).then(snap=>{
        const worker=snap.exists()&&snap.data().worker ? snap.data().worker : employeeId;
        document.getElementById('updater').value=worker;
        document.getElementById('user-email-disp').textContent=worker;
      }).catch(e=>{
        console.warn('[worker取得失敗] employeeId:', employeeId, e.message);
      });
    }
    // ユーザーごとのライン選択を復元
    loadMobSel();
    // 旧形式ドキュメントIDの自動マイグレーション（ログイン時に1回実行）
    migrateOldDocIds();
    refreshAllDL();
    // 入力タブでもドロップダウンにラインを即反映させるため、ログイン直後に起動
    startInputListener();
    // ログイン時に「18:00済みで未リセット」なら自動リセット実行（アプリを閉じていた場合も補完）
    checkAndResetOnLogin();
    setStatus('fb-ok','✅ Firebase 接続完了 — リアルタイム共有が有効です');
  }else{
    currentUser=null;
    stopListener();
    stopInputListener();
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('main-app').style.display='none';
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
    const inputTab=document.querySelector(".tab[onclick=\"switchTab('input')\"]");
    if(inputTab) inputTab.classList.add('active');
    const inputPane=document.getElementById('pane-input');
    if(inputPane) inputPane.classList.add('active');
  }
});
</script>

<script>
// iOS SafariのダブルタップズームをJSで完全無効化
(function(){
  // gesturestart/gesturechange で拡大縮小を防ぐ
  document.addEventListener('gesturestart',  function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gestureend',    function(e){ e.preventDefault(); }, {passive:false});
  // ダブルタップを検出してpreventDefault
  let lastTap = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTap < 300){
      e.preventDefault();
    }
    lastTap = now;
  }, {passive:false});
  // pinchズームも防ぐ
  document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1){ e.preventDefault(); }
  }, {passive:false});
})();
</script>
