<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP-M課 生産リアルタイムボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;font-size:14px;background:#f0f2f5;color:#222;min-height:100vh}
.header{background:#1D9E75;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.header h1{font-size:16px;font-weight:700}
.header .subtitle{font-size:12px;opacity:.8;margin-top:2px}
.app{max-width:700px;margin:0 auto;padding:12px}
.tab-bar{display:flex;background:#fff;border-radius:10px;padding:4px;gap:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab{flex:1;padding:9px 12px;border:none;background:none;cursor:pointer;font-size:14px;color:#888;border-radius:7px;font-weight:500;transition:all .15s}
.tab.active{background:#1D9E75;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(29,158,117,.35)}
.pane{display:none}
.pane.active{display:block}
.card{border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:13px;font-weight:700;color:#444;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';display:inline-block;width:4px;height:14px;background:#1D9E75;border-radius:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:#888;font-weight:500}
.field input[type=text]{height:36px;padding:0 10px;border:1px solid #d0d0d0;border-radius:7px;font-size:14px;background:#fafafa;width:100%;transition:all .15s}
.field input[type=text]:focus{outline:none;border-color:#1D9E75;background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.field input[type=text][readonly]{background:#f0f0f0;color:#555;cursor:default}
.field-xl{flex:3;min-width:140px}
.field-lg{flex:2;min-width:110px}
.field-sm{flex:1;min-width:75px}
.chk-row{display:flex;align-items:center;gap:16px;margin-top:10px;padding-top:8px;border-top:1px dashed #eee}
.chk-row .chk-label{font-size:12px;color:#888;font-weight:500}
.chk-row label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;color:#333}
.chk-row input[type=checkbox]{width:17px;height:17px;accent-color:#1D9E75;cursor:pointer}
.sec-label{font-size:11px;font-weight:700;color:#1D9E75;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec-label::after{content:'';flex:1;height:1px;background:#d5f0e8}
.next-row-hd{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:3px;padding:0 2px}
.next-row-hd span{font-size:11px;color:#999;font-weight:600}
.next-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:7px}
.btn-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn-save{padding:11px 28px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(29,158,117,.35);transition:all .15s}
.btn-save:hover{background:#168a63}
.btn-save:active{transform:scale(.97)}
.btn-save:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-reset{padding:11px 18px;background:#fff;color:#888;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:#f5f5f5;color:#333;border-color:#bbb}
.err{background:#fee;color:#a00;border:1px solid #fcc;border-radius:8px;padding:9px 13px;margin-top:8px;font-size:13px;display:none}
.err.show{display:block}
.loaded-banner{font-size:12px;color:#0F6E56;background:#E1F5EE;border:1px solid #9FE1CB;border-radius:8px;padding:8px 13px;margin-bottom:10px;display:none;align-items:center;gap:6px}
.loaded-banner.show{display:flex}
.fb-status{font-size:11px;padding:6px 12px;border-radius:7px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fb-ok{background:#E1F5EE;color:#0F6E56;border:1px solid #9FE1CB}
.fb-err{background:#fee;color:#a00;border:1px solid #fcc}
.fb-wait{background:#f5f5f5;color:#888;border:1px solid #ddd}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:9px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999;white-space:nowrap;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* ===== ログイン画面 ===== */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0d2f6e 0%,#1251a3 45%,#0a3d8f 100%);z-index:9000;display:flex;align-items:center;justify-content:center}
#login-screen::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,20,80,.06) 3px,rgba(0,20,80,.06) 4px);pointer-events:none}
.lg-box{position:relative;background:rgba(5,30,90,.80);border:1px solid rgba(120,180,255,.35);border-radius:18px;padding:40px 36px;display:flex;flex-direction:column;align-items:center;gap:18px;width:320px;max-width:92vw}
.lg-logo{font-size:32px}
.lg-title{font-size:16px;font-weight:700;color:#aed8ff;letter-spacing:.06em;text-align:center;line-height:1.5}
.lg-sub{font-size:12px;color:#6a9fd8;letter-spacing:.04em}
.lg-field{width:100%;display:flex;flex-direction:column;gap:5px}
.lg-field label{font-size:12px;color:#7ab2dd;font-weight:600;letter-spacing:.04em}
.lg-field input{height:42px;padding:0 14px;border:1px solid rgba(120,180,255,.35);border-radius:9px;background:rgba(160,210,255,.07);color:#dff0ff;font-size:14px;width:100%;outline:none;transition:all .15s}
.lg-field input::placeholder{color:rgba(160,210,255,.35)}
.lg-field input:focus{border-color:rgba(160,210,255,.7);background:rgba(160,210,255,.12);box-shadow:0 0 0 3px rgba(120,180,255,.15)}
.lg-btn{width:100%;height:44px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.04em;box-shadow:0 3px 12px rgba(29,158,117,.45)}
.lg-btn:hover{background:#168a63}
.lg-btn:active{transform:scale(.97)}
.lg-btn:disabled{opacity:.5;cursor:not-allowed}
.lg-err{font-size:13px;color:#ff8080;min-height:18px;text-align:center;width:100%}
.lg-loading{font-size:13px;color:#6a9fd8;text-align:center;display:none}
@keyframes lgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* ===== 閲覧画面 ===== */
#pane-view{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:linear-gradient(160deg,#0d2f6e 0%,#1251a3 45%,#0a3d8f 100%);
  overflow:hidden;z-index:200;display:none;flex-direction:column;
}
#pane-view.active{display:flex}
#pane-view::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,20,80,.06) 3px,rgba(0,20,80,.06) 4px);pointer-events:none;z-index:0}
.view-header-bar{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:8px 18px;background:rgba(5,30,90,.75);border-bottom:1px solid rgba(120,180,255,.35);flex-shrink:0}
.view-title-block h2{font-size:18px;font-weight:700;color:#aed8ff;letter-spacing:.08em;text-shadow:0 0 16px rgba(160,210,255,.7)}
.view-title-block .sub{font-size:13px;color:#6a9fd8;margin-top:1px;letter-spacing:.04em}
.view-ctrl{display:flex;align-items:center;gap:8px}
.ref-btn{padding:5px 12px;border:1px solid rgba(160,210,255,.45);border-radius:6px;background:rgba(160,210,255,.12);font-size:12px;cursor:pointer;color:#aed8ff;transition:all .15s}
.ref-btn:hover{background:rgba(160,210,255,.25);color:#cceeff}
.back-btn{padding:5px 12px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:rgba(255,255,255,.06);font-size:12px;cursor:pointer;color:#aaa;transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.clock{font-size:30px;font-weight:700;color:#fff;letter-spacing:.12em;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(180,220,255,.9);min-width:120px;text-align:right}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,.7);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ページインジケーター */
.page-indicator{display:flex;gap:6px;align-items:center}
.page-dot{width:8px;height:8px;border-radius:50%;background:rgba(160,210,255,.25);border:1px solid rgba(160,210,255,.4);transition:all .3s;cursor:pointer}
.page-dot.active{background:#aed8ff;box-shadow:0 0 6px rgba(160,210,255,.6)}

/* グリッド */
.view-page{position:relative;z-index:1;flex:1;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr;gap:5px;padding:5px;background:rgba(120,180,255,.18);align-content:stretch}

/* ラインカード — 文字が映える深めのコントラスト背景 */
.vline{
  background:linear-gradient(160deg,rgba(4,20,70,.92) 0%,rgba(6,28,90,.88) 100%);
  border:1px solid rgba(80,140,220,.4);
  border-radius:4px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(120,180,255,.1);
}
.vl-hd{
  padding:8px 10px;display:flex;align-items:center;gap:5px;flex-wrap:nowrap;
  position:relative;
  background:linear-gradient(90deg,rgba(10,55,160,.95) 0%,rgba(5,35,130,.9) 100%);
  border-bottom:3px solid rgba(120,200,255,.7);
  border-left:5px solid rgba(120,200,255,.85);
  flex-shrink:0;overflow:hidden;
}
.vl-no{font-size:28px;font-weight:900;color:#fff;letter-spacing:.04em;white-space:nowrap;text-shadow:0 0 18px rgba(160,220,255,1),0 0 30px rgba(100,180,255,.6);line-height:1;flex-shrink:0}
.vl-who{font-size:14px;color:#cce8ff;background:rgba(140,200,255,.18);padding:2px 7px;border-radius:3px;white-space:nowrap;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vl-when{font-size:12px;color:#6aaee0;margin-left:auto;white-space:nowrap;flex-shrink:0}
.vl-del-btn{
  background:rgba(255,80,80,.15);border:1px solid rgba(255,100,100,.35);color:#ff8080;
  border-radius:4px;padding:2px 7px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all .15s;line-height:1.8;
}
.vl-del-btn:hover{background:rgba(255,80,80,.35);color:#fff;border-color:rgba(255,120,120,.6)}

/* 統合レイアウト */
.vl-body{padding:4px 8px 0;flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.vl-prod-wrap{flex:5;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.vl-next-wrap{flex:3;min-height:0;overflow:hidden;display:flex;flex-direction:column;border-top:2px solid rgba(160,215,255,.2)}
.prow-hd{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;background:rgba(30,90,210,.45);border-bottom:1px solid rgba(160,215,255,.3);flex-shrink:0;font-size:12px;color:#7ab8e8;font-weight:700;height:26px;box-sizing:border-box}
.next-sep-hd{padding:0 6px;background:rgba(30,90,210,.3);color:#9fd0ff;font-size:13px;font-weight:700;letter-spacing:.06em;border-bottom:1px solid rgba(160,215,255,.25);flex-shrink:0;height:26px;box-sizing:border-box;display:flex;align-items:center}
.prows-body{flex:1;display:flex;flex-direction:column;min-height:0}
.prow{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2px 6px;border-bottom:1px solid rgba(100,160,255,.12);min-height:0;overflow:hidden}
.prow:last-child{border-bottom:none}
.prow-name{font-size:14px;color:#e8f4ff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.prow-sub{display:flex;align-items:center;gap:4px;margin-top:2px;flex-wrap:nowrap}
.prow-empty .prow-name{opacity:.2;font-size:13px}
.proc-empty{color:#2a4060;font-size:12px}
.proc-tag{font-size:12px;color:#ffe066;background:rgba(255,220,50,.13);border:1px solid rgba(255,220,50,.5);padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block;font-weight:600}
.cbadge{font-size:12px;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block;font-weight:600}
.cb-on{background:rgba(255,180,200,.15);color:#ffb3c6;border:1px solid rgba(255,160,185,.5)}
.cb-off{background:rgba(255,255,255,.04);color:#2a4060;border:1px solid rgba(255,255,255,.06)}
.next-badge{font-size:14px;color:#7df4ff;background:rgba(100,230,255,.1);border:1px solid rgba(100,230,255,.3);padding:2px 7px;border-radius:3px;white-space:nowrap;display:inline-block;font-weight:600}
.no-data-row td{color:#2a4060;font-size:18px;padding:10px 8px;text-align:center}
/* 未入力スロットのプレースホルダー行 */
.placeholder-row td{opacity:.18;font-size:16px;pointer-events:none}
.placeholder-row .td-name{color:#7ab8e8;font-style:normal}

.empty{text-align:center;padding:40px 16px;color:#3a6090;font-size:14px;line-height:2}
@media(max-width:600px){
  .view-page{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}
  .next-row{grid-template-columns:1fr}
  .next-row-hd{display:none}
  .field-xl,.field-lg,.field-sm{min-width:0}
}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="lg-box">
    <div class="lg-logo" style="font-size:14px;letter-spacing:.08em;color:#aed8ff;font-weight:700">JP-M課</div>
    <div class="lg-title">JP-M課<br>生産リアルタイムボード</div>
    <div class="lg-sub">IDとパスワードでログイン</div>
    <div class="lg-field">
      <label>ID</label>
      <input type="text" id="lg-email" placeholder="例：a001" autocomplete="username" inputmode="text">
    </div>
    <div class="lg-field">
      <label>パスワード</label>
      <input type="password" id="lg-pass" placeholder="パスワード" autocomplete="current-password">
    </div>
    <div class="lg-err" id="lg-err"></div>
    <button class="lg-btn" id="lg-btn" onclick="doLogin()">ログイン</button>
    <div class="lg-loading" id="lg-loading">認証中…</div>
  </div>
</div>

<div id="main-app" style="display:none">
<div class="header">
  <div style="flex:1">
    <h1>JP-M課 生産リアルタイムボード</h1>
    <div class="subtitle">稼働製品・工程・NEXT生産予定 入力・閲覧システム</div>
  </div>
  <div id="header-user" style="display:flex;align-items:center;gap:10px;flex-shrink:0">
    <span id="user-email-disp" style="font-size:11px;opacity:.75;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <button onclick="doLogout()" style="padding:5px 12px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap">ログアウト</button>
  </div>
</div>

<div class="app">
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('input')">📝 情報入力</button>
    <button class="tab" onclick="switchTab('view')">📋 閲覧表示</button>
  </div>

  <!-- 情報入力 -->
  <div id="pane-input" class="pane active">
    <div class="fb-status fb-wait" id="fb-status">⏳ Firebase 接続中…</div>
    <div class="loaded-banner" id="loaded-banner"><span>✅</span><span id="loaded-msg"></span></div>

    <div class="card">
      <div class="card-title">基本情報</div>
      <div class="row">
        <div class="field field-sm">
          <label>ライン No. ＊</label>
          <input type="text" id="lineNo" list="dl-lineNo" placeholder="例：A-01" autocomplete="off" oninput="onLineNoInput()">
          <datalist id="dl-lineNo"></datalist>
        </div>
        <div class="field field-lg">
          <label>更新者名（自動）</label>
          <input type="text" id="updater" placeholder="ログイン者名" autocomplete="off" readonly>
        </div>
      </div>
    </div>

    <div class="sec-label">稼働製品詳細</div>
    <div class="card">
      <div class="card-title">品名 ①</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn1" list="dl-pn1" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn1"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps1" list="dl-ps1" placeholder="01" autocomplete="off"><datalist id="dl-ps1"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe1" list="dl-pe1" placeholder="05" autocomplete="off"><datalist id="dl-pe1"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_1"> 1回目</label><label><input type="checkbox" id="c2_1"> 2回目</label></div>
    </div>
    <div class="card">
      <div class="card-title">品名 ②</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn2" list="dl-pn2" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn2"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps2" list="dl-ps2" placeholder="01" autocomplete="off"><datalist id="dl-ps2"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe2" list="dl-pe2" placeholder="05" autocomplete="off"><datalist id="dl-pe2"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_2"> 1回目</label><label><input type="checkbox" id="c2_2"> 2回目</label></div>
    </div>
    <div class="card">
      <div class="card-title">品名 ③</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn3" list="dl-pn3" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn3"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps3" list="dl-ps3" placeholder="01" autocomplete="off"><datalist id="dl-ps3"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe3" list="dl-pe3" placeholder="05" autocomplete="off"><datalist id="dl-pe3"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_3"> 1回目</label><label><input type="checkbox" id="c2_3"> 2回目</label></div>
    </div>
    <div class="card">
      <div class="card-title">品名 ④</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn4" list="dl-pn4" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn4"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps4" list="dl-ps4" placeholder="01" autocomplete="off"><datalist id="dl-ps4"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe4" list="dl-pe4" placeholder="05" autocomplete="off"><datalist id="dl-pe4"></datalist></div>
      </div>
      <div class="chk-row"><span class="chk-label">中間検査：</span><label><input type="checkbox" id="c1_4"> 1回目</label><label><input type="checkbox" id="c2_4"> 2回目</label></div>
    </div>
    <div class="card">
      <div class="card-title">品名 ⑤</div>
      <div class="row">
        <div class="field field-xl"><label>品名</label><input type="text" id="pn5" list="dl-pn5" placeholder="品名を入力" autocomplete="off"><datalist id="dl-pn5"></datalist></div>
        <div class="field field-sm"><label>工程 開始</label><input type="text" id="ps5" list="dl-ps5" placeholder="01" autocomplete="off"><datalist id="dl-ps5"></datalist></div>
        <div class="field field-sm"><label>工程 終了</label><input type="text" id="pe5" list="dl-pe5" placeholder="05" autocomplete="off"><datalist id="dl-pe5"></datalist></div>
      </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, deleteDoc, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyASiL5-z-DpyDEytgsvBLKYh5ij0jdwuuc",
  authDomain: "seizou-l-mg.firebaseapp.com",
  projectId: "seizou-l-mg",
  storageBucket: "seizou-l-mg.firebasestorage.app",
  messagingSenderId: "309855928656",
  appId: "1:309855928656:web:2ab2c19e3bcb2962836c55",
  measurementId: "G-FT6RG5MVZL"
};

const fbApp  = initializeApp(firebaseConfig);
const db     = getFirestore(fbApp);
const auth   = getAuth(fbApp);
const COL    = "lines";
const COL_USERS = "users"; // ユーザー情報コレクション
let currentUser = null;

/* ===== ユーザーID→氏名マップ（Firestoreが読めない場合のフォールバック） =====
   Firestoreのusersコレクションから自動取得しますが、
   セキュリティルール等で取得できない場合はこちらを参照します。
   新しいユーザーはFirestoreのusersコレクションに追加してください。 */
const USER_MAP = {
  'a001': '山田',
  'a002': '北村',
  'a003': '田中',
  'a004': '佐藤',
  'a005': '鈴木',
  'b001': '',   // 必要に応じて名前を入力
  'b002': '北村',
  // 必要に応じて追加
};

const MARKS    = ['①','②','③','④','⑤'];
const LS_HIST  = 'seisan_hist_v3';
const MAX_HIST = 5;
const PAGE_SIZE = 4; // 1画面に表示するライン数
let allLines   = [];
let currentPage = 0;
let pageTimer  = null;

/* ===== Firebase ステータス ===== */
function setStatus(type, msg){
  const el = document.getElementById('fb-status');
  if(el){ el.className='fb-status '+type; el.textContent=msg; }
}

/* ===== 履歴 ===== */
function getHist(){ try{ return JSON.parse(localStorage.getItem(LS_HIST)||'{}'); }catch(e){ return {}; } }
function addHist(fk,val){
  if(!val) return;
  const h=getHist(); if(!h[fk]) h[fk]=[];
  h[fk]=[val,...h[fk].filter(v=>v!==val)].slice(0,MAX_HIST);
  localStorage.setItem(LS_HIST,JSON.stringify(h));
}
function buildDL(fk,dlId){
  const h=getHist(); const dl=document.getElementById(dlId); if(!dl) return;
  dl.innerHTML='';
  (h[fk]||[]).forEach(v=>{ const o=document.createElement('option'); o.value=v; dl.appendChild(o); });
}
const ALL_FIELDS=[
  ['lineNo','dl-lineNo'],
  ['pn1','dl-pn1'],['ps1','dl-ps1'],['pe1','dl-pe1'],
  ['pn2','dl-pn2'],['ps2','dl-ps2'],['pe2','dl-pe2'],
  ['pn3','dl-pn3'],['ps3','dl-ps3'],['pe3','dl-pe3'],
  ['pn4','dl-pn4'],['ps4','dl-ps4'],['pe4','dl-pe4'],
  ['pn5','dl-pn5'],['ps5','dl-ps5'],['pe5','dl-pe5'],
  ['nn1','dl-nn1'],['nps1','dl-nps1'],['npe1','dl-npe1'],
  ['nn2','dl-nn2'],['nps2','dl-nps2'],['npe2','dl-npe2'],
  ['nn3','dl-nn3'],['nps3','dl-nps3'],['npe3','dl-npe3'],
];
function refreshAllDL(){ ALL_FIELDS.forEach(([fk,dl])=>buildDL(fk,dl)); }

/* ===== フォーム操作 ===== */
function v(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function chk(id){ const e=document.getElementById(id); return e?e.checked:false; }
function setV(id,val){ const e=document.getElementById(id); if(e) e.value=val||''; }
function setChk(id,val){ const e=document.getElementById(id); if(e) e.checked=!!val; }

function showBanner(msg){
  const b=document.getElementById('loaded-banner');
  const m=document.getElementById('loaded-msg');
  if(msg){ m.textContent=msg; b.className='loaded-banner show'; }
  else{ b.className='loaded-banner'; }
}
function fillForm(data){
  // updaterはログイン者名固定なので上書きしない
  const prods=data.prods||[];
  for(let i=0;i<5;i++){
    const p=prods[i]||{};
    setV('pn'+(i+1),p.name); setV('ps'+(i+1),p.start); setV('pe'+(i+1),p.end);
    setChk('c1_'+(i+1),p.check1); setChk('c2_'+(i+1),p.check2);
  }
  const nexts=data.nexts||[];
  for(let i=0;i<3;i++){
    const n=nexts[i]||{};
    setV('nn'+(i+1),n.name); setV('nps'+(i+1),n.start); setV('npe'+(i+1),n.end);
  }
}
function clearProductAndNext(){
  for(let i=1;i<=5;i++){
    setV('pn'+i,''); setV('ps'+i,''); setV('pe'+i,'');
    setChk('c1_'+i,false); setChk('c2_'+i,false);
  }
  for(let i=1;i<=3;i++){
    setV('nn'+i,''); setV('nps'+i,''); setV('npe'+i,'');
  }
}

/* ライン No. 入力→前回データ自動ロード
   ラインNoが変わるたびに毎回Firestoreを検索。
   既存データがあれば読み込み、なければ空欄のまま新規入力モード。
   これにより「ムラタ→リセット→シミズ」と入力し直した場合、
   シミズの既存データ（あれば）を正しくロードし、
   保存時はシミズのドキュメントに書き込む。 */
let lineTimer=null;
let prevLineNo=''; // 直前のラインNo（変化検知用）

window.onLineNoInput = function(){
  const lineNo=v('lineNo');
  clearTimeout(lineTimer);
  showBanner('');
  if(!lineNo){
    prevLineNo='';
    clearProductAndNext();
    return;
  }
  // 同じ値が連続して来た場合（IME確定など）はスキップ
  if(lineNo===prevLineNo) return;
  prevLineNo=lineNo;
  // 入力が変わったら即クリア→500ms後にFirestore検索
  clearProductAndNext();
  lineTimer=setTimeout(async ()=>{
    try{
      const snap=await getDoc(doc(db,COL,toDocId(lineNo)));
      if(snap.exists()){
        fillForm(snap.data());
        showBanner('ライン '+lineNo+' の既存データを読み込みました（上書き更新モード）');
      } else {
        showBanner('新規ライン '+lineNo+' として登録します');
      }
    }catch(e){}
  },500);
};

function toDocId(lineNo){
  // Firestoreのドキュメントは日本語を含むUnicode文字が有効です
  // 無効な文字はスラッシュ(/)のみのため、スラッシュだけを置換します
  let id = lineNo.replace(/\//g, '_');
  // Firestoreで予約済みの '.' '..' を回避
  if(id === '.' || id === '..') id = '_' + id;
  return id;
}

window.resetForm = function(){
  setV('lineNo','');
  // updaterはログイン者名を維持
  clearProductAndNext(); showBanner('');
  prevLineNo='';
  document.getElementById('err-msg').className='err';
};

/* ===== 保存 ===== */
function showErr(msg){ const e=document.getElementById('err-msg'); e.textContent=msg; e.className='err'+(msg?' show':''); }
function showToast(msg,ok){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=ok===false?'#c0392b':'#1D9E75';
  t.className='toast show'; setTimeout(()=>t.className='toast',2800);
}

window.saveData = async function(){
  showErr('');
  const lineNo=v('lineNo');
  if(!lineNo){ showErr('ライン No. を入力してください。'); return; }
  const btn=document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='保存中…';

  ALL_FIELDS.forEach(([fk])=>addHist(fk,v(fk)));
  refreshAllDL();

  const prods=[];
  for(let i=1;i<=5;i++) prods.push({name:v('pn'+i),start:v('ps'+i),end:v('pe'+i),check1:chk('c1_'+i),check2:chk('c2_'+i)});
  const nexts=[];
  for(let i=1;i<=3;i++) nexts.push({name:v('nn'+i),start:v('nps'+i),end:v('npe'+i)});

  const updaterName = document.getElementById('updater').value || (currentUser?currentUser.email.replace('@factory.local',''):'');
  const data={lineNo, updater:updaterName, prods, nexts, updatedAt:new Date().toISOString()};

  try{
    await setDoc(doc(db,COL,toDocId(lineNo)), data);
    showToast('ライン '+lineNo+' を保存しました ✓',true);
    window.resetForm();
  }catch(e){
    showToast('保存エラー：'+(e.message||String(e)),false);
    showErr('Firebase保存エラー：'+(e.message||String(e)));
  }
  btn.disabled=false; btn.textContent='💾 保存・更新';
};

/* ===== 削除 ===== */
window.deleteLine = async function(docId, lineNo){
  if(!confirm('ライン「'+lineNo+'」を削除しますか？')) return;
  try{
    await deleteDoc(doc(db,COL,docId));
    showToast('ライン '+lineNo+' を削除しました',true);
  }catch(e){
    showToast('削除エラー：'+e.message,false);
  }
};

/* ===== ソート関数（数値昇順→文字列後尾） ===== */
function sortLines(lines){
  return [...lines].sort((a,b)=>{
    const aNo=(a.lineNo||''), bNo=(b.lineNo||'');
    const aNum=parseInt(aNo,10), bNum=parseInt(bNo,10);
    const aIsNum=!isNaN(aNum)&&String(aNum)===aNo.trim();
    const bIsNum=!isNaN(bNum)&&String(bNum)===bNo.trim();
    if(aIsNum&&bIsNum) return aNum-bNum;
    if(aIsNum) return -1;
    if(bIsNum) return 1;
    return aNo.localeCompare(bNo,'ja',{numeric:true});
  });
}

/* ===== 閲覧レンダリング ===== */
function fmt(iso){
  if(!iso)return'';
  const d=new Date(iso);
  return(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function procLabel(start,end){
  const s=(start||'').trim(),e=(end||'').trim();
  if(!s&&!e) return '';
  if(!e||s===e) return s||e;
  return s+'〜'+e;
}

function renderPage(pageIdx){
  const el=document.getElementById('view-body');
  if(!allLines.length){
    el.innerHTML='<div class="empty" style="grid-column:1/-1">📋 登録データがありません</div>';
    renderPageDots(0,0); return;
  }
  const totalPages=Math.ceil(allLines.length/PAGE_SIZE);
  const pi=((pageIdx%totalPages)+totalPages)%totalPages;
  currentPage=pi;
  const slice=allLines.slice(pi*PAGE_SIZE,(pi+1)*PAGE_SIZE);

  el.innerHTML=slice.map(l=>{
    const docId = l._id || toDocId(l.lineNo); // 実際のFirestore IDを使用
    const allProds = l.prods || [];
    const allNexts = l.nexts || [];

    // 稼働製品行：①〜⑤ 全スロット表示（未入力はプレースホルダー）
    const prodRows = MARKS.map((mark, i) => {
      const p = allProds[i] || {};
      if(p.name){
        const proc = procLabel(p.start, p.end);
        return `<div class="prow">
          <div class="prow-name"><strong>${mark}</strong> ${p.name}</div>
          <div class="prow-sub">
            ${proc?`<span class="proc-tag">${proc}</span>`:'<span class="proc-empty">—</span>'}
            <span class="cbadge ${p.check1?'cb-on':'cb-off'}">${p.check1?'1回目✓':'1回目'}</span>
            <span class="cbadge ${p.check2?'cb-on':'cb-off'}">${p.check2?'2回目✓':'2回目'}</span>
          </div>
        </div>`;
      } else {
        return `<div class="prow prow-empty">
          <div class="prow-name"><strong>${mark}</strong> —</div>
        </div>`;
      }
    }).join('');

    // NEXT行：①〜③ 全スロット表示（未入力はプレースホルダー）
    const nextRows = [0,1,2].map(i => {
      const n = allNexts[i] || {};
      if(n.name){
        const proc = procLabel(n.start, n.end);
        return `<div class="prow">
          <div class="prow-name" style="color:#9fe3ff"><strong>${MARKS[i]}</strong> ${n.name}</div>
          <div class="prow-sub">
            ${proc?`<span class="proc-tag" style="color:#7df4ff;border-color:rgba(100,230,255,.4)">${proc}</span>`:'<span class="proc-empty">—</span>'}
          </div>
        </div>`;
      } else {
        return `<div class="prow prow-empty">
          <div class="prow-name"><strong>${MARKS[i]}</strong> —</div>
        </div>`;
      }
    }).join('');

    return `<div class="vline">
      <div class="vl-hd">
        <span class="vl-no">${l.lineNo}<span style="font-size:16px;font-weight:600;opacity:.7;margin-left:4px">ライン</span></span>
        <span style="flex:1"></span>
        ${l.updater?`<span class="vl-who">${l.updater}</span>`:''}

        <button class="vl-del-btn" onclick="deleteLine('${docId}','${l.lineNo}')">削除</button>
      </div>
      <div class="vl-body">
        <div class="vl-prod-wrap">
          <div class="prow-hd">
            <span>品名</span><span>工程 / 中間検査</span>
          </div>
          <div class="prows-body">${prodRows}</div>
        </div>
        <div class="vl-next-wrap">
          <div class="next-sep-hd">▼ NEXT 生産予定</div>
          <div class="prows-body">${nextRows}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  renderPageDots(pi,totalPages);
}

function renderPageDots(pi,total){
  const el=document.getElementById('page-indicator');
  if(!el) return;
  el.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='page-dot'+(i===pi?' active':'');
    d.onclick=(()=>{const idx=i; return ()=>{ stopPageTimer(); currentPage=idx; renderPage(idx); startPageTimer(); };})();
    el.appendChild(d);
  }
}

function startPageTimer(){
  stopPageTimer();
  pageTimer=setInterval(()=>{
    const total=Math.ceil(allLines.length/PAGE_SIZE)||1;
    renderPage((currentPage+1)%total);
  },30000);
}
function stopPageTimer(){
  if(pageTimer){ clearInterval(pageTimer); pageTimer=null; }
}

function renderLines(lines){
  allLines=sortLines(lines);
  renderPage(currentPage);
}

/* ===== 旧形式ドキュメントID自動マイグレーション =====
   旧コードでは日本語ライン名が "___" に変換されて保存されていた。
   ログイン時に一度だけ実行し、IDが正しくないドキュメントを整理する。 */
async function migrateOldDocIds(){
  try{
    const snapshot = await getDocs(query(collection(db,COL)));
    for(const d of snapshot.docs){
      const data = d.data();
      const lineNo = data.lineNo || '';
      if(!lineNo) continue;
      const correctId = toDocId(lineNo);
      if(d.id === correctId) continue; // 正常なIDはスキップ

      // 正しいIDのドキュメントが既に存在するか確認
      const existingSnap = await getDoc(doc(db,COL,correctId));
      if(existingSnap.exists()){
        // 正しいIDのドキュメントが既にある → 古い方だけ削除
        await deleteDoc(doc(db,COL,d.id));
        console.log('[Migration] 重複旧ドキュメント削除:', d.id, '→ 保持:', correctId);
      } else {
        // 正しいIDのドキュメントが無い → データを正しいIDに移動
        await setDoc(doc(db,COL,correctId), data);
        await deleteDoc(doc(db,COL,d.id));
        console.log('[Migration] ドキュメントID修正:', d.id, '→', correctId);
      }
    }
  }catch(e){
    console.warn('[Migration] エラー:', e);
  }
}

/* ===== Firestore リアルタイムリスナー ===== */
let unsubscribe=null;
function startListener(){
  if(unsubscribe) return;
  const q=query(collection(db,COL));
  unsubscribe=onSnapshot(q,
    (snapshot)=>{
      const lines=[];
      // 実際のFirestoreドキュメントIDも保持する（正確な削除のため）
      snapshot.forEach(d=>lines.push({...d.data(), _id: d.id}));
      renderLines(lines);
      document.getElementById('refreshed-at').textContent=
        'LIVE 最終更新：'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      document.getElementById('live-dot').style.display='block';
      setStatus('fb-ok','✅ Firebase リアルタイム接続中');
    },
    (err)=>{
      document.getElementById('refreshed-at').textContent='接続エラー';
      document.getElementById('live-dot').style.display='none';
      setStatus('fb-err','❌ Firebase エラー：'+err.message);
    }
  );
}
function stopListener(){
  if(unsubscribe){ unsubscribe(); unsubscribe=null; }
  document.getElementById('live-dot').style.display='none';
  stopPageTimer();
}

/* ===== 時計 ===== */
function updateClock(){
  const el=document.getElementById('clock');
  if(el) el.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000);

/* ===== タブ切替 ===== */
window.switchTab=function(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const btn=document.querySelector(`.tab[onclick="switchTab('${tab}')"]`);
  if(btn) btn.classList.add('active');
  document.getElementById('pane-'+tab).classList.add('active');
  if(tab==='view'){ startListener(); updateClock(); startPageTimer(); }
  else{ stopListener(); }
};

/* ===== ログイン / ログアウト ===== */
window.doLogin=async function(){
  const rawId=document.getElementById('lg-email').value.trim();
  const pass=document.getElementById('lg-pass').value;
  const errEl=document.getElementById('lg-err');
  const btn=document.getElementById('lg-btn');
  const loading=document.getElementById('lg-loading');
  errEl.textContent='';
  if(!rawId||!pass){ errEl.textContent='IDとパスワードを入力してください'; return; }
  const email=rawId.includes('@')?rawId:rawId+'@factory.local';
  btn.disabled=true; loading.style.display='block';
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){
    let msg='ログインに失敗しました';
    if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') msg='IDまたはパスワードが正しくありません';
    else if(e.code==='auth/invalid-email') msg='IDの形式が正しくありません';
    else if(e.code==='auth/too-many-requests') msg='ログイン試行が多すぎます。しばらく待ってください';
    errEl.textContent=msg;
    document.querySelector('.lg-box').style.animation='lgShake .4s ease';
    setTimeout(()=>document.querySelector('.lg-box').style.animation='',500);
  }
  btn.disabled=false; loading.style.display='none';
};

window.doLogout=async function(){
  stopListener();
  await signOut(auth);
};

document.getElementById('lg-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') window.doLogin(); });
document.getElementById('lg-email').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lg-pass').focus(); });

/* ===== 認証状態の監視 ===== */
onAuthStateChanged(auth,user=>{
  if(user){
    currentUser=user;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-app').style.display='block';
    const uid=user.email.replace('@factory.local','');
    // まずUSER_MAPのフォールバック名を即時セット
    const fallback=USER_MAP[uid]||uid;
    document.getElementById('updater').value=fallback;
    document.getElementById('user-email-disp').textContent=uid+' ('+fallback+')';
    // Firestoreのusersコレクションから正式な名前を取得して上書き
    getDoc(doc(db,COL_USERS,uid)).then(snap=>{
      const name=snap.exists()?(snap.data().worker||fallback):fallback;
      document.getElementById('updater').value=name;
      document.getElementById('user-email-disp').textContent=uid+' ('+name+')';
    }).catch(e=>{
      // 取得失敗（セキュリティルール等）→ フォールバック名を使用
      console.warn('[ユーザー名取得失敗] Firestoreルールを確認してください:', e.code);
    });
    // 旧形式ドキュメントIDの自動マイグレーション（ログイン時に1回実行）
    migrateOldDocIds();
    refreshAllDL();
    setStatus('fb-ok','✅ Firebase 接続完了 — リアルタイム共有が有効です');
  }else{
    currentUser=null;
    stopListener();
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('main-app').style.display='none';
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
    const inputTab=document.querySelector(".tab[onclick=\"switchTab('input')\"]");
    if(inputTab) inputTab.classList.add('active');
    const inputPane=document.getElementById('pane-input');
    if(inputPane) inputPane.classList.add('active');
  }
});
</script>
</body>
</html>
